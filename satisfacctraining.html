<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta de satisfacción — Área de Training · TMLF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C;
    --ink-soft:#2A2B2E;
    --paper:#F6F4EE;
    --paper-2:#FFFFFF;
    --line:#E4DFD1;
    --line-strong:#D2C9AE;
    --gold:#B9925A;
    --gold-deep:#9A7638;
    --gold-pale:#F1E6CC;
    --text:#17181A;
    --text-soft:#6B6A63;
    --good:#3E6B4F;
    --bad:#A63B32;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(185,146,90,.10), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(11,11,12,.05), transparent 40%);
    background-attachment:fixed;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .accent-serif{font-family:'Cormorant Garamond',serif; font-style:italic;}
  ::selection{background:var(--gold-pale);}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:var(--ink); color:#EFEAE0; border-bottom:1px solid #000;
  }
  .topbar-inner{ max-width:920px; margin:0 auto; padding:16px 24px 0; }
  .topbar-row{ display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:14px; }
  .topbar-brand{display:flex; align-items:center; gap:10px;}
  .topbar-brand img{height:26px; width:auto; display:block; filter:brightness(0) invert(1);}
  .topbar-brand-txt{display:flex; flex-direction:column; line-height:1.15;}
  .topbar-title{font-family:'Fraunces',serif; font-size:13.5px; font-weight:600; color:#F6F1E4;}
  .topbar-sub{font-size:12px; color:#9A968A; letter-spacing:.4px; text-transform:uppercase; font-weight:600;}
  .topbar-step{
    font-size:11px; color:var(--ink); font-weight:700; white-space:nowrap;
    background:linear-gradient(120deg,#D9B97C,var(--gold));
    padding:5px 12px; border-radius:20px; letter-spacing:.2px;
  }
  .progress-track{height:3px; width:100%; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden; margin-bottom:12px;}
  .progress-fill{height:100%; background:linear-gradient(90deg,#D9B97C,var(--gold)); width:0%; transition:width .45s cubic-bezier(.4,0,.2,1);}

  /* page dots (book pages within current chapter) */
  .page-dots{display:flex; gap:5px; padding-bottom:12px; flex-wrap:wrap;}
  .page-dots .dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.18); transition:all .2s ease;}
  .page-dots .dot.done{background:var(--gold);}
  .page-dots .dot.current{background:#F6F1E4; width:18px; border-radius:5px;}

  /* ---------- Book stage ---------- */
  .book-stage{
    max-width:920px; margin:0 auto; padding:48px 24px 140px;
    perspective:1400px;
  }
  .chapter-head{ display:flex; align-items:flex-start; gap:18px; margin-bottom:26px; }
  .chapter-num{
    font-family:'Fraunces',serif; font-size:44px; font-weight:300; color:var(--line-strong); line-height:1; margin-top:-4px;
  }
  .chapter-eyebrow{ font-size:12px; color:var(--gold-deep); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; }
  .chapter-title{ font-size:25px; line-height:1.3; font-weight:700; color:var(--ink); margin:0; }

  .book-page{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:42px 46px 38px;
    position:relative;
    box-shadow:0 1px 0 var(--line), 0 18px 40px rgba(11,11,12,.06);
    transform-origin:left center;
  }
  .book-page::before{
    content:""; position:absolute; left:0; top:14px; bottom:14px; width:5px;
    background:linear-gradient(180deg,var(--gold-pale),var(--line-strong));
    border-radius:4px 0 0 4px;
  }
  .book-page.anim-next{animation:pageInNext .38s cubic-bezier(.2,.7,.3,1);}
  .book-page.anim-prev{animation:pageInPrev .38s cubic-bezier(.2,.7,.3,1);}
  @keyframes pageInNext{
    from{opacity:0; transform:translateX(26px) rotateY(-8deg);}
    to{opacity:1; transform:translateX(0) rotateY(0);}
  }
  @keyframes pageInPrev{
    from{opacity:0; transform:translateX(-26px) rotateY(8deg);}
    to{opacity:1; transform:translateX(0) rotateY(0);}
  }
  .book-page.invalid{box-shadow:0 0 0 1.5px var(--bad), 0 18px 40px rgba(166,59,50,.10);}

  .sub-question{
    margin-top:8px;
    animation:subIn .3s ease;
  }
  .sub-question.invalid .qerr{display:flex;}
  .sub-divider{
    display:flex; align-items:center; gap:10px;
    margin:26px 0 22px;
  }
  .sub-divider::before{content:"↳"; font-size:15px; color:var(--gold); flex:none;}
  .sub-divider::after{content:""; flex:1; height:1px; background:var(--line);}
  .sub-qtext{font-size:16px !important;}
  @keyframes subIn{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .qnum-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .qnum{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Fraunces',serif; font-weight:700; font-size:13.5px; color:var(--gold-deep); letter-spacing:.3px;
  }
  .qnum::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--gold);}
  .qopt-tag{font-size:10.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.6px; font-weight:600;}
  .qopt-tag.multi{color:var(--gold-deep); background:var(--gold-pale); padding:3px 9px; border-radius:10px;}
  .multi-hint{color:var(--text-soft) !important; font-weight:500;}
  .qtext{ font-size:21px; line-height:1.5; font-weight:500; color:var(--ink); margin:0 0 4px; }
  .qhint{font-size:13.5px; color:var(--gold-deep); margin:6px 0 6px; font-style:italic; font-weight:500;}
  .qerr{
    display:none; font-size:12.5px; color:var(--bad); margin-top:16px; font-weight:600;
    align-items:center; gap:7px; background:#FBEDEB; border-radius:var(--radius); padding:10px 13px;
  }

  .opt-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:12px; margin-top:22px;}
  .opt{
    display:flex; align-items:center; gap:13px;
    border:1px solid var(--line); padding:14px 17px; border-radius:var(--radius);
    cursor:pointer; transition:border-color .15s ease, background .15s ease; font-size:16.5px; background:var(--paper-2);
  }
  .opt:hover{border-color:var(--gold); background:#FEFCF7;}
  .opt input{accent-color:var(--gold-deep); width:17px; height:17px; flex:none;}
  .opt.checked{border-color:var(--gold-deep); background:linear-gradient(90deg,var(--gold-pale),#fff 65%);}
  .opt span{line-height:1.4;}

  .other-field{margin-top:10px; margin-left:2px; display:none;}
  .other-field.show{display:block;}
  .other-field input[type=text]{
    width:100%; border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:12px 14px; font-family:'Inter',sans-serif; font-size:15.5px; background:#FCFAF3;
  }
  .other-field input[type=text]:focus{outline:2px solid var(--gold); outline-offset:1px;}

  .scale5{display:flex; gap:12px; margin-top:26px;}
  .scale5 button{
    flex:1; aspect-ratio:1/0.86; padding:6px 4px; border:1.5px solid var(--line); background:var(--paper-2);
    border-radius:50%; cursor:pointer; font-family:'Fraunces',serif; font-size:23px; font-weight:600; color:var(--ink-soft);
    transition:all .18s cubic-bezier(.4,0,.2,1); display:flex; align-items:center; justify-content:center;
  }
  .scale5 button:hover{border-color:var(--gold); transform:translateY(-2px);}
  .scale5 button.sel{
    background:linear-gradient(150deg,var(--ink),#000); border-color:var(--ink); color:var(--gold-pale);
    transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.22);
  }
  .scale5-labels{display:flex; justify-content:space-between; margin-top:12px; font-size:12.5px; color:var(--text-soft); gap:6px; font-weight:500;}
  .scale5-labels span{flex:1; text-align:center; line-height:1.3;}
  .scale5-labels span:first-child{text-align:left;}
  .scale5-labels span:last-child{text-align:right;}

  .scale11{display:flex; gap:7px; margin-top:26px; flex-wrap:wrap;}
  .scale11 button{
    width:56px; padding:12px 2px; border:1.5px solid var(--line); background:var(--paper-2);
    border-radius:8px; cursor:pointer; font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--ink-soft);
    transition:all .15s ease;
  }
  .scale11 button:hover{border-color:var(--gold); transform:translateY(-2px);}
  .scale11 button.sel{background:linear-gradient(150deg,var(--ink),#000); border-color:var(--ink); color:var(--gold-pale); box-shadow:0 6px 16px rgba(0,0,0,.22);}
  .scale11-labels{display:flex; justify-content:space-between; margin-top:12px; font-size:13px; color:var(--text-soft); font-weight:500;}

  textarea{
    width:100%; min-height:150px; margin-top:24px; border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; font-family:'Inter',sans-serif; font-size:16.5px; resize:vertical; background:#FCFAF3; line-height:1.6;
  }
  textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .char-counter{ font-size:12.5px; color:var(--text-soft); margin-top:8px; font-weight:600; }
  .char-counter.warn{color:var(--bad);}
  .char-counter.ok{color:var(--good);}

  .navbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding:16px 24px; box-shadow:0 -10px 26px rgba(11,11,12,.06);
  }
  .navbar-inner{ max-width:920px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .btn{
    font-family:'Inter',sans-serif; font-weight:700; font-size:14px; padding:13px 26px; border-radius:30px;
    border:1.5px solid transparent; cursor:pointer; transition:all .18s ease; letter-spacing:.1px;
  }
  .btn-primary{background:var(--ink); color:var(--gold-pale);}
  .btn-primary:hover{background:#000; transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.22);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line-strong);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn:disabled{opacity:.3; cursor:not-allowed; transform:none; box-shadow:none;}
  .nav-meta{font-size:13px; color:var(--text-soft); text-align:center; flex:1; font-weight:600;}
  .nav-meta b{color:var(--gold-deep);}

  .cover{ max-width:680px; margin:0 auto; padding:64px 24px 40px; text-align:center; position:relative; }
  .cover-logo{width:104px; height:auto; margin:0 auto 30px; display:block;}
  .cover-rule{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:22px;}
  .cover-rule .ln{width:34px; height:1px; background:var(--line-strong);}
  .cover-eyebrow{color:var(--gold-deep); font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase;}
  .cover-date{font-size:13px; color:var(--text-soft); font-weight:600; letter-spacing:.4px; margin-bottom:4px;}
  .cover h1{font-size:40px; line-height:1.15; margin:0 0 20px; color:var(--ink); font-weight:600;}
  .cover h1 em{font-style:italic; font-family:'Cormorant Garamond',serif; color:var(--gold-deep); font-weight:500;}
  .cover p{font-size:16.5px; color:var(--text-soft); line-height:1.75; max-width:54ch; margin:0 auto 20px;}
  .cover-meta{ display:flex; justify-content:center; gap:0; margin:0 0 40px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .cover-meta div{flex:1; text-align:center; padding:20px 10px; border-right:1px solid var(--line); background:var(--paper-2);}
  .cover-meta div:last-child{border-right:none;}
  .cover-meta .num{font-family:'Fraunces',serif; font-size:26px; color:var(--ink); font-weight:600;}
  .cover-meta .lbl{font-size:10.5px; color:var(--text-soft); margin-top:4px; text-transform:uppercase; letter-spacing:.6px;}
  .cover-foot{font-size:11.5px; color:var(--text-soft); margin-top:26px; letter-spacing:.3px;}
  .admin-entry{margin-top:18px;}
  .admin-entry a{font-size:11.5px; color:var(--text-soft); text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .admin-entry a:hover{color:var(--gold-deep);}

  .about-box{
    text-align:left; background:var(--paper-2); border:1px solid var(--line);
    border-left:3px solid var(--gold); border-radius:var(--radius); padding:26px 28px 24px; margin:0 0 32px;
  }
  .about-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink); margin-bottom:14px; letter-spacing:.2px;}
  .about-box p{font-size:14.5px; line-height:1.75; color:var(--text-soft); margin:0 0 12px; max-width:none;}
  .about-box p strong{color:var(--ink); font-weight:700;}
  .about-box p:last-child{margin-bottom:0;}
  .about-goal{color:var(--ink-soft) !important;}
  .about-goal span{font-weight:700; color:var(--gold-deep); font-family:'Fraunces',serif; font-style:italic; font-size:14px;}

  .thanks-icon{
    width:64px; height:64px; border-radius:50%; background:linear-gradient(150deg,var(--ink),#000);
    display:flex; align-items:center; justify-content:center; margin:0 auto 26px; box-shadow:0 10px 26px rgba(0,0,0,.25);
  }

  .admin-login-box{text-align:left; max-width:340px; margin:0 auto;}
  .admin-input{
    width:100%; border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:13px 14px; font-family:'Inter',sans-serif; font-size:14.5px; background:#FCFAF3;
  }
  .admin-input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .admin-err{font-size:12.5px; color:var(--bad); margin-top:10px; font-weight:600;}

  .admin-topbar{background:var(--ink); color:#EFEAE0; position:sticky; top:0; z-index:50;}
  .admin-topbar-inner{
    max-width:1040px; margin:0 auto; padding:18px 24px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .admin-wrap{max-width:1040px; margin:0 auto; padding:32px 24px 80px;}
  .site-filter{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .site-filter-lbl{ font-size:12.5px; color:var(--text-soft); font-weight:700; margin-right:2px; }
  .site-chip{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--paper-2); border:1px solid var(--line); border-radius:20px; padding:7px 15px; cursor:pointer;
    transition:all .15s ease;
  }
  .site-chip:hover{border-color:var(--gold);}
  .site-chip.active{background:var(--ink); border-color:var(--ink); color:var(--gold-pale);}
  .site-filter-note{font-size:11.5px; color:var(--text-soft); font-style:italic; margin-left:4px;}

  .admin-tabs{display:flex; gap:6px; margin-bottom:26px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .admin-tab{
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; color:var(--text-soft);
    background:transparent; border:none; border-bottom:2px solid transparent;
    padding:11px 6px; cursor:pointer; margin-right:18px; transition:all .15s ease;
  }
  .admin-tab:hover{color:var(--ink);}
  .admin-tab.active{color:var(--ink); border-bottom-color:var(--gold);}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:16px;}
  .kpi-card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px;}
  .kpi-title{font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--ink); margin-bottom:14px; line-height:1.35;}

  .nps-score{font-family:'Fraunces',serif; font-size:44px; font-weight:700; line-height:1;}
  .nps-score.pos{color:var(--good);}
  .nps-score.neg{color:var(--bad);}
  .nps-sub{font-size:11.5px; color:var(--text-soft); margin:4px 0 16px;}
  .nps-stack{display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--paper);}
  .nps-seg.detractor{background:var(--bad);}
  .nps-seg.passive{background:var(--gold-pale);}
  .nps-seg.promoter{background:var(--good);}
  .nps-legend{display:flex; flex-direction:column; gap:5px; margin-top:12px; font-size:11.5px; color:var(--text-soft);}
  .nps-legend .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
  .nps-legend .dot.detractor{background:var(--bad);}
  .nps-legend .dot.passive{background:var(--gold-pale); border:1px solid var(--line-strong);}
  .nps-legend .dot.promoter{background:var(--good);}

  .csat-score{font-family:'Fraunces',serif; font-size:38px; font-weight:700; color:var(--ink);}
  .csat-score span{font-size:16px; color:var(--text-soft); font-weight:500;}

  .donut-row{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .donut-legend{display:flex; flex-direction:column; gap:8px; flex:1; min-width:140px;}
  .donut-legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);}
  .donut-dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .donut-legend-label{flex:1;}
  .donut-legend-val{color:var(--text-soft); font-weight:600;}
  .donut-legend-val span{font-weight:400;}

  .oa-controls{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px;}
  .oa-block{margin-bottom:30px;}
  .oa-count{font-size:11.5px; color:var(--gold-deep); font-weight:600; margin:-8px 0 12px;}
  .oa-items{display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto;}
  .open-answer-item{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;}
  .open-answer-item p{margin:0; font-size:13.5px; line-height:1.6; color:var(--ink-soft);}
  .oa-site-tag{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--gold-deep); background:var(--gold-pale); border-radius:10px; padding:2px 8px; margin-bottom:6px;
  }
  .admin-stats{display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap;}
  .admin-stat{ flex:1; min-width:140px; background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:20px; text-align:center; }
  .admin-stat-num{font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--ink);}
  .admin-stat-lbl{font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.6px; margin-top:4px;}
  .admin-note{ font-size:12.5px; color:var(--gold-deep); background:var(--gold-pale); border-radius:var(--radius); padding:12px 16px; margin-bottom:24px; line-height:1.5; }
  .sheet-diag{margin-top:12px;}
  .sheet-diag-box{background:rgba(255,255,255,.6); border-radius:var(--radius); padding:12px 14px;}
  .sheet-diag-diag{font-size:12.5px; line-height:1.6; margin-bottom:10px; color:var(--ink-soft);}
  .sheet-diag-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; color:var(--text-soft); margin-bottom:4px;}
  .sheet-diag-raw{
    font-family:'Menlo','Consolas',monospace; font-size:11px; background:var(--ink); color:#D8D3C4;
    padding:10px 12px; border-radius:4px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; margin:0;
  }
  .admin-empty{font-size:14px; color:var(--text-soft); padding:40px 0; text-align:center;}
  .admin-section{margin-bottom:36px;}
  .admin-section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--ink);
    border-bottom:1.5px solid var(--line-strong); padding-bottom:10px; margin-bottom:16px;
  }
  .admin-qcard{
    background:var(--paper-2); border:1px solid var(--line); border-left:3px solid var(--line-strong);
    border-radius:var(--radius); padding:20px 22px; margin-bottom:12px;
  }
  .admin-qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .admin-qnum{font-family:'Fraunces',serif; font-weight:600; font-size:12px; color:var(--gold-deep);}
  .admin-qanswered{font-size:11px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.4px;}
  .admin-qtext{font-size:15.5px; font-weight:600; color:var(--ink); margin:0 0 14px; line-height:1.45;}
  .admin-avg{font-size:12.5px; color:var(--text-soft); margin-bottom:10px;}
  .admin-avg b{color:var(--ink); font-family:'Fraunces',serif; font-size:14px;}
  .admin-bars{display:flex; flex-direction:column; gap:7px;}
  .admin-bar-row{display:flex; align-items:center; gap:10px;}
  .admin-bar-label{flex:0 0 34%; font-size:13.5px; color:var(--ink-soft); line-height:1.3;}
  .admin-bar-track{flex:1; height:9px; background:var(--paper); border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .admin-bar-fill{height:100%; background:linear-gradient(90deg,var(--gold-deep),var(--gold)); border-radius:6px;}
  .admin-bar-count{flex:0 0 64px; font-size:11.5px; color:var(--text-soft); text-align:right;}
  .admin-bar-count span{color:var(--text-soft);}
  .admin-open-list{margin-top:12px; display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;}
  .admin-open-title{font-size:11px; color:var(--gold-deep); text-transform:uppercase; letter-spacing:.5px; font-weight:700; margin-bottom:4px;}
  .admin-open-item{font-size:13px; color:var(--ink-soft); background:var(--paper); border-radius:var(--radius); padding:9px 12px; line-height:1.5;}
  .admin-empty-mini{font-size:12.5px; color:var(--text-soft); font-style:italic;}

  @media(max-width:600px){
    .book-stage{padding:30px 16px 150px;}
    .chapter-title{font-size:19px;}
    .chapter-num{font-size:34px;}
    .book-page{padding:24px 18px 22px;}
    .qtext{font-size:18.5px;}
    .scale5{gap:7px;}
    .scale5 button{font-size:18px;}
    .scale11 button{width:44px; font-size:14.5px;}
    .cover h1{font-size:28px;}
    .cover{padding:48px 18px 24px;}
    .cover-meta{flex-wrap:wrap;}
    .cover-meta div{flex:1 1 33%; border-bottom:1px solid var(--line);}
    .navbar{padding:13px 16px;}
    .nav-meta{display:none;}
    .btn{padding:12px 20px; font-size:13.5px;}
    .admin-bar-label{flex-basis:40%;}
    .admin-topbar-inner{padding:14px 16px;}
  }
</style>
</head>

// Lista plana de todas las preguntas, usada para armar un objeto legible
// (etiqueta de pregunta → respuesta en texto) que se envía junto con cada
// envío, para que la Google Sheet guarde una columna por pregunta en vez
// de un bloque de JSON.
const ALL_QUESTIONS_FLAT = [];
SECTIONS.forEach((s,si2)=> s.questions.forEach((q,qi2)=>{
  const tag = q.num ? ("P"+q.num) : "Seg";
  const shortText = q.text.length>60 ? q.text.slice(0,59)+"…" : q.text;
  const label = "S"+(si2+1)+" "+tag+" - "+shortText;
  ALL_QUESTIONS_FLAT.push({ key: "s"+si2+"-q"+qi2, label: label });
}));

function buildFlatAnswers(){
  const flat = {};
  ALL_QUESTIONS_FLAT.forEach(function(entry){
    let v = answers[entry.key];
    if(v===undefined || v===null || v==="") return;
    if(Array.isArray(v)) v = v.join("; ");
    const other = otherText[entry.key];
    if(other && String(other).trim()) v = String(v) + " (" + String(other).trim() + ")";
    flat[entry.label] = v;
  });
  return flat;
}

function qKey(s, q){ return "s"+s+"-q"+q; }

function isRequired(q){ return q.type !== "open"; }

function isVisible(sIdx, qIdx){
  const q = SECTIONS[sIdx].questions[qIdx];
  if(!q.showIf) return true;
  const refVal = answers[qKey(sIdx, q.showIf.refQi)];
  if(refVal===undefined || refVal===null) return false;
  return q.showIf.in.includes(refVal);
}

function isQuestionHidden(sIdx, qIdx){
  const q = SECTIONS[sIdx].questions[qIdx];
  if(!q.hideIf) return false;
  const refVal = answers[qKey(sIdx, q.hideIf.refQi)];
  if(refVal===undefined || refVal===null) return false;
  return q.hideIf.in.includes(refVal);
}

function getChildIndices(sIdx, parentQi){
  const qs = SECTIONS[sIdx].questions;
  const result = [];
  qs.forEach((q,i)=>{ if(q.showIf && q.showIf.refQi === parentQi) result.push(i); });
  return result;
}

function isSectionActive(sIdx){
  const sec = SECTIONS[sIdx];
  if(sec.showIf){
    const refVal = answers[qKey(sec.showIf.si, sec.showIf.qi)];
    if(refVal===undefined || refVal===null || !sec.showIf.in.includes(refVal)) return false;
  }
  if(sec.hideIf){
    const refVal = answers[qKey(sec.hideIf.si, sec.hideIf.qi)];
    if(refVal!==undefined && refVal!==null && sec.hideIf.in.includes(refVal)) return false;
  }
  return true;
}

function nextActiveSection(sIdx){
  let s = sIdx+1;
  while(s < SECTIONS.length && !isSectionActive(s)) s++;
  return s < SECTIONS.length ? s : null;
}

function prevActiveSection(sIdx){
  let s = sIdx-1;
  while(s >= 0 && !isSectionActive(s)) s--;
  return s >= 0 ? s : null;
}

// Posición de esta sección entre las secciones realmente activas en el
// recorrido actual (ignora las que se saltan por bifurcación), para que
// el numeral grande de cada capítulo coincida con el número que trae su
// propia etiqueta (ej. "SECCIÓN 6").
function activeSectionPosition(sIdx){
  let pos = 0;
  for(let s=0; s<=sIdx; s++){ if(isSectionActive(s)) pos++; }
  return pos;
}

function isAnswered(sIdx,qIdx){
  const v = answers[qKey(sIdx,qIdx)];
  if(v===undefined || v===null || v==="") return false;
  if(Array.isArray(v) && v.length===0) return false;
  return true;
}

// Las preguntas abiertas son opcionales, pero si se escribe algo, deben tener
// al menos 10 caracteres para poder continuar.
function openTooShort(sIdx, qIdx){
  const q = SECTIONS[sIdx].questions[qIdx];
  if(q.type !== "open") return false;
  const v = answers[qKey(sIdx,qIdx)];
  if(typeof v !== "string") return false;
  const len = v.trim().length;
  return len > 0 && len < 10;
}

function visibleQIndices(sIdx){
  // Las preguntas condicionales (showIf) no son páginas propias: viven dentro
  // de la página de su pregunta padre. Las preguntas con hideIf se saltan
  // por completo cuando la condición se cumple (p. ej. no recibiste training).
  return SECTIONS[sIdx].questions.map((q,i)=>i).filter(i =>
    !SECTIONS[sIdx].questions[i].showIf && !isQuestionHidden(sIdx,i)
  );
}

function totalVisibleQuestions(){
  let c=0;
  for(let s=0;s<SECTIONS.length;s++){ if(isSectionActive(s)) c += visibleQIndices(s).length; }
  return c;
}

function flattenedPosition(){
  let idx=0;
  for(let s=0;s<si;s++){ if(isSectionActive(s)) idx += visibleQIndices(s).length; }
  const vis = visibleQIndices(si);
  idx += vis.indexOf(qi) + 1;
  return idx;
}

function renderQuestionControl(sIdx, qIdx, q){
  const key = qKey(sIdx,qIdx);
  let body = "";

  if(q.type === "single"){
    body = `<div class="opt-list">` + q.options.map((opt)=>{
      const checked = answers[key] === opt;
      return `<label class="opt ${checked?"checked":""}">
        <input type="radio" name="${key}" value="${escapeAttr(opt)}" ${checked?"checked":""} onchange="setSingle('${key}','${escapeJs(opt)}')">
        <span>${escapeHtml(opt)}</span>
      </label>`;
    }).join("") + `</div>`;
    if(q.options.includes("Otro") || q.options.includes("Otra")){
      const isOtherSelected = answers[key]==="Otro" || answers[key]==="Otra";
      body += `<div class="other-field ${isOtherSelected?"show":""}" id="other-${key}">
        <input type="text" placeholder="Especifica…" value="${escapeAttr(otherText[key]||"")}" oninput="setOtherText('${key}', this.value)">
      </div>`;
    }
  }
  else if(q.type === "multi"){
    const sel = answers[key] || [];
    body = `<div class="opt-list">` + q.options.map((opt)=>{
      const checked = sel.includes(opt);
      return `<label class="opt ${checked?"checked":""}">
        <input type="checkbox" value="${escapeAttr(opt)}" ${checked?"checked":""} onchange="toggleMulti('${key}','${escapeJs(opt)}')">
        <span>${escapeHtml(opt)}</span>
      </label>`;
    }).join("") + `</div>`;
    if(q.options.includes("Otro") || q.options.includes("Otra")){
      const isOtherSelected = sel.includes("Otro") || sel.includes("Otra");
      body += `<div class="other-field ${isOtherSelected?"show":""}" id="other-${key}">
        <input type="text" placeholder="Especifica…" value="${escapeAttr(otherText[key]||"")}" oninput="setOtherText('${key}', this.value)">
      </div>`;
    }
  }
  else if(q.type === "scale5"){
    const val = answers[key];
    body = `<div class="scale5">` + [1,2,3,4,5].map(n=>{
      return `<button type="button" class="${val===n?"sel":""}" onclick="setScale('${key}',${n})">${n}</button>`;
    }).join("") + `</div>`;
    if(q.labels){
      body += `<div class="scale5-labels">` + q.labels.map(l=>`<span>${escapeHtml(l)}</span>`).join("") + `</div>`;
    } else {
      body += `<div class="scale5-labels"><span>Muy bajo</span><span></span><span>Medio</span><span></span><span>Muy alto</span></div>`;
    }
  }
  else if(q.type === "scale11"){
    const val = answers[key];
    body = `<div class="scale11">` + Array.from({length:11},(_,n)=>n).map(n=>{
      return `<button type="button" class="${val===n?"sel":""}" onclick="setScale('${key}',${n})">${n}</button>`;
    }).join("") + `</div>`;
    body += `<div class="scale11-labels"><span>${escapeHtml(q.lowLabel||"")}</span><span>${escapeHtml(q.highLabel||"")}</span></div>`;
  }
  else if(q.type === "open"){
    const val = answers[key] || "";
    const len = val.trim().length;
    const counterClass = len===0 ? "" : (len<10 ? "warn" : "ok");
    const counterText = len===0 ? "Opcional · si respondes, escribe al menos 10 caracteres" : (len<10 ? `${len}/10 caracteres mínimo` : `${len} caracteres`);
    body = `<textarea placeholder="Escribe tu respuesta…" oninput="setOpen('${key}', this.value)">${escapeHtml(val)}</textarea>
      <div class="char-counter ${counterClass}" id="counter-${key}">${counterText}</div>`;
  }

  return body;
}

/* =========================================================
   HANDLERS de respuesta (re-render en el lugar, sin saltar de página)
   ========================================================= */
function setSingle(key, value){ answers[key] = value; currentInvalid.clear(); renderInPlace(); }
function toggleMulti(key, value){
  const arr = answers[key] ? answers[key].slice() : [];
  const idx = arr.indexOf(value);
  if(idx>-1) arr.splice(idx,1); else arr.push(value);
  answers[key] = arr;
  currentInvalid.clear();
  renderInPlace();
}
function setOtherText(key, value){ otherText[key] = value; }
function setScale(key, n){ answers[key] = n; currentInvalid.clear(); renderInPlace(); }
function setOpen(key, value){
  answers[key] = value;
  const len = value.trim().length;
  const el = document.getElementById("counter-"+key);
  if(el){
    if(len===0){ el.textContent = "Opcional · si respondes, escribe al menos 10 caracteres"; el.className = "char-counter"; }
    else if(len<10){ el.textContent = len + "/10 caracteres mínimo"; el.className = "char-counter warn"; }
    else{ el.textContent = len + " caracteres"; el.className = "char-counter ok"; }
  }
  currentInvalid.delete(currentOpenKeyIndex(key));
}
function currentOpenKeyIndex(key){
  // key tiene forma s{si}-q{qi}; devolvemos el qi para poder limpiar el estado de invalidez.
  const m = key.match(/-q(\d+)$/);
  return m ? parseInt(m[1],10) : -1;
}

// Re-renderiza solo la pantalla de pregunta actual, sin mover el scroll ni animar como página nueva.
function renderInPlace(){
  const prevDir = navDir;
  navDir = "none";
  renderQuestionScreen();
  navDir = prevDir;
}

/* =========================================================

   ========================================================= */
function nextQuestion(){
  const q = SECTIONS[si].questions[qi];
  currentInvalid.clear();
  let ok = true;
  if(isRequired(q) && !isAnswered(si,qi)){ currentInvalid.add(qi); ok = false; }
  if(openTooShort(si,qi)){ currentInvalid.add(qi); ok = false; }
  getChildIndices(si,qi).forEach(ci=>{
    if(isVisible(si,ci)){
      const cq = SECTIONS[si].questions[ci];
      if(isRequired(cq) && !isAnswered(si,ci)){ currentInvalid.add(ci); ok = false; }
      if(openTooShort(si,ci)){ currentInvalid.add(ci); ok = false; }
    }
  });
  if(!ok){
    navDir = "none";
    renderQuestionScreen();
    return;
  }
  const vis = visibleQIndices(si);
  const pos = vis.indexOf(qi);
  if(pos < vis.length-1){
    qi = vis[pos+1];
    navDir = "next";
    window.scrollTo(0,0);
    render();
  } else {
    const nxt = nextActiveSection(si);
    if(nxt !== null){
      si = nxt;
      qi = visibleQIndices(si)[0];
      navDir = "next";
      window.scrollTo(0,0);
      render();
    } else {
      submitSurvey();
    }
  }
}

function prevQuestion(){
  currentInvalid.clear();
  const vis = visibleQIndices(si);
  const pos = vis.indexOf(qi);
  if(pos > 0){
    qi = vis[pos-1];
    navDir = "prev";
    window.scrollTo(0,0);
    render();
  } else {
    const prv = prevActiveSection(si);
    if(prv !== null){
      si = prv;
      const prevVis = visibleQIndices(si);
      qi = prevVis[prevVis.length-1];
      navDir = "prev";
      window.scrollTo(0,0);
      render();
    } else {
      screen = "cover";
      window.scrollTo(0,0);
      render();
    }
  }
}

async function submitSurvey(){
  const payload = {
    ts: Date.now(),
    answers: JSON.parse(JSON.stringify(answers)),
    other: JSON.parse(JSON.stringify(otherText)),
    flat: buildFlatAnswers(),
  };
  screen = "thanks";
  window.scrollTo(0,0);
  render();
  await persistSubmission(payload);
}

const SUBMIT_ENDPOINT = "https://script.google.com/macros/s/AKfycbxcO2CoIhkkRfev2RXLOij_DqjqM-kpwqZ1MS7UsFvpx9BCYMyhVlGgVIEfg3TtYmOs/exec";

// Lee la Sheet directamente por fetch(), con caché desactivada y un
// reintento corto por si el primer intento falla por un arranque en frío
// del Apps Script o un error de red pasajero.
async function fetchSheetDirect(retries){
  retries = retries===undefined ? 1 : retries;
  const url = SUBMIT_ENDPOINT + (SUBMIT_ENDPOINT.indexOf("?")>-1?"&":"?") + "t=" + Date.now();
  let lastErr;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      const res = await fetch(url, { method: "GET", cache: "no-store" });
      return await res.json();
    }catch(e){
      lastErr = e;
      if(attempt < retries) await new Promise(r=>setTimeout(r, 500));
    }
  }
  throw lastErr;
}

function fetchSheetJSONP(timeoutMs){
  return new Promise((resolve)=>{
    let done = false;
    const cbName = "__sheetCb_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
    const cleanup = ()=>{
      delete window[cbName];
      const tag = document.getElementById(cbName);
      if(tag) tag.remove();
    };
    window[cbName] = (data)=>{
      if(done) return; done = true;
      cleanup();
      resolve(data);
    };
    const script = document.createElement("script");
    script.id = cbName;
    script.src = SUBMIT_ENDPOINT + (SUBMIT_ENDPOINT.indexOf("?")>-1?"&":"?") + "callback=" + cbName + "&t=" + Date.now();
    script.onerror = ()=>{
      if(done) return; done = true;
      cleanup();
      resolve(null);
    };
    document.body.appendChild(script);
    setTimeout(()=>{
      if(done) return; done = true;
      cleanup();
      resolve(null);
    }, timeoutMs || 9000);
  });
}

// Envía por POST sin depender de poder LEER la respuesta: Apps Script
// redirige la petición internamente y esa lectura cruzada puede fallar
// por CORS aunque el dato ya se haya guardado correctamente en la Sheet.
// mode:"no-cors" evita ese falso negativo — solo falla si de verdad no
// hay conexión.
async function postToSheet(payload, retries){
  if(!isSheetEndpointConfigured()) return false;
  retries = retries===undefined ? 2 : retries;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      await fetch(SUBMIT_ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      return true;
    }catch(e){
      console.error("Envío a Google Sheet (intento "+(attempt+1)+") falló:", e);
      if(attempt < retries) await new Promise(r=>setTimeout(r, 700));
    }
  }
  return false;
}

async function persistSubmission(payload){
  const id = "submission_" + payload.ts + "_" + Math.random().toString(36).slice(2,8);
  const sheetOk = await postToSheet(payload);
  try{
    if(window.storage){
      await window.storage.set(id, JSON.stringify(payload), true);
    }
  }catch(e){ console.error("storage.set falló:", e); }
  try{
    const key = "tmlf_training_submissions";
    const raw = localStorage.getItem(key);
    const arr = raw ? JSON.parse(raw) : [];
    // Marca si ya se logró sincronizar con la Sheet, para poder reintentar
    // más tarde solo las que quedaron pendientes.
    arr.push(Object.assign({}, payload, { _synced: sheetOk }));
    localStorage.setItem(key, JSON.stringify(arr));
  }catch(e){ console.error("localStorage falló:", e); }
  return sheetOk;
}

async function loadAllSubmissions(){
  let subs = [];
  let remoteOk = false;
  let sheetOk = false;
  try{
    if(isSheetEndpointConfigured()){
      let data = null;
      try{
        data = await fetchSheetDirect();
      }catch(e){
        console.warn("Lectura directa de Google Sheet no respondió, probando por JSONP como respaldo:", e);
        data = await fetchSheetJSONP();
      }
      if(Array.isArray(data)){
        sheetOk = true;
        remoteOk = true;
        data.forEach(s=>{ if(s && s.ts) subs.push(Object.assign({}, s, { _source:"sheet" })); });
      }
    }
  }catch(e){ console.error("Lectura de Google Sheet falló:", e); }
  try{
    if(window.storage){
      const list = await window.storage.list("submission_", true);
      if(list && list.keys && list.keys.length){
        remoteOk = true;
        const seen = new Set(subs.map(s=>s.ts));
        for(const k of list.keys){
          try{
            const r = await window.storage.get(k, true);
            if(r && r.value){
              const parsed = JSON.parse(r.value);
              if(!seen.has(parsed.ts)){ subs.push(Object.assign({}, parsed, { _source:"storage" })); seen.add(parsed.ts); }
            }
          }catch(e){}
        }
      }
    }
  }catch(e){ console.error("storage.list falló:", e); }
  try{
    const raw = localStorage.getItem("tmlf_training_submissions");
    if(raw){
      const arr = JSON.parse(raw);
      const seen = new Set(subs.map(s=>s.ts));
      arr.forEach(s=>{ if(!seen.has(s.ts)){ subs.push(Object.assign({}, s, { _source:"local" })); seen.add(s.ts); } });
    }
  }catch(e){}
  subs.sort((a,b)=> b.ts - a.ts);
  return { subs, remoteOk, sheetOk };
}

// Reintenta enviar a la Sheet las respuestas que solo quedaron guardadas
// en este navegador (por ejemplo, por un corte de conexión al enviarlas).
async function retryPendingLocalSubmissions(){
  let raw;
  try{ raw = localStorage.getItem("tmlf_training_submissions"); }catch(e){ raw = null; }
  if(!raw) return { sent:0, pending:0 };
  let arr;
  try{ arr = JSON.parse(raw); }catch(e){ return { sent:0, pending:0 }; }
  let sent = 0;
  for(let i=0;i<arr.length;i++){
    if(!arr[i]._synced){
      const ok = await postToSheet({ ts:arr[i].ts, answers:arr[i].answers, other:arr[i].other, flat:arr[i].flat }, 1);
      if(ok){ arr[i]._synced = true; sent++; }
    }
  }
  try{ localStorage.setItem("tmlf_training_submissions", JSON.stringify(arr)); }catch(e){}
  const pending = arr.filter(s=>!s._synced).length;
  return { sent, pending };
}

function clearLocalSubmissions(){
  try{ localStorage.removeItem("tmlf_training_submissions"); }catch(e){}
}

async function runSheetDiagnostic(){
  const el = document.getElementById("sheet-diag-result");
  if(!el) return;
  el.innerHTML = "Probando…";
  let raw = "";
  let fetchError = "";
  try{
    const url = SUBMIT_ENDPOINT + (SUBMIT_ENDPOINT.indexOf("?")>-1?"&":"?") + "t=" + Date.now();
    const res = await fetch(url, { method:"GET", cache:"no-store" });
    raw = await res.text();
  }catch(e){
    fetchError = String(e);
  }

  let diagnosis = "";
  if(fetchError){
    diagnosis = `<b>fetch() directo falló:</b> ${escapeHtml(fetchError)}<br>Esto por sí solo no confirma la causa — súbelo abajo el resultado de la lectura JSONP.`;
  } else if(/accounts\.google\.com|ServiceLogin|ha solicitado acceso a tu cuenta/i.test(raw)){
    diagnosis = `<b>Diagnóstico: el acceso de la implementación NO está en "Cualquier usuario".</b> La respuesta es una página de inicio de sesión de Google en vez de datos — por eso falla tanto la lectura como (probablemente) el guardado. Corrige el acceso en "Gestionar implementaciones" y crea una nueva versión.`;
  } else if(/^\s*\[/.test(raw) || /^\s*\{/.test(raw)){
    diagnosis = `<b>La URL sí devuelve JSON correctamente.</b> Si aun así el panel no lo muestra, es probable que la lectura por <code>&lt;script&gt;</code> (JSONP) esté bloqueada por una política de seguridad de la página donde abriste este archivo. Intenta abrir el archivo HTML directamente desde tu computadora (doble clic) en vez de dentro de un visor/artifact.`;
  } else if(raw){
    diagnosis = `<b>Respuesta inesperada (no es JSON):</b> revisa que el código del Apps Script sea exactamente el proporcionado y que hayas creado una <b>nueva versión</b> al implementar.`;
  } else {
    diagnosis = `No se obtuvo respuesta. Revisa tu conexión a internet o que la URL siga siendo válida.`;
  }

  const preview = raw ? escapeHtml(raw.slice(0,300)) : "(sin contenido)";
  el.innerHTML = `
    <div class="sheet-diag-box">
      <div class="sheet-diag-diag">${diagnosis}</div>
      <div class="sheet-diag-label">Primeros caracteres de la respuesta real:</div>
      <pre class="sheet-diag-raw">${preview}</pre>
    </div>
  `;
}

/* --------- Utilidades de agregación / gráficos --------- */
function findQuestion(predicate){
  for(let si2=0; si2<SECTIONS.length; si2++){
    const qs = SECTIONS[si2].questions;
    for(let qi2=0; qi2<qs.length; qi2++){
      if(predicate(qs[qi2])) return { si:si2, qi:qi2, q:qs[qi2] };
    }
  }
  return null;
}

const DONUT_COLORS = ["#9A7638","#0B0B0C","#B9925A","#3E6B4F","#6B6A63","#A63B32","#4C6B8A"];

function svgDonut(data, size, thickness){
  size = size || 132; thickness = thickness || 20;
  const total = data.reduce((a,d)=>a+d.value,0);
  const radius = size/2 - thickness/2;
  const circumference = 2*Math.PI*radius;
  if(total <= 0){
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="#E4DFD1" stroke-width="${thickness}"/></svg>`;
  }
  let acc = 0;
  const circles = data.map(d=>{
    const frac = d.value/total;
    const dash = frac*circumference;
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${d.color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    acc += dash;
    return el;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg>`;
}

function renderDonutBlock(title, subs, key, options){
  const counts = {};
  options.forEach(o=>counts[o]=0);
  let answered = 0;
  subs.forEach(sub=>{
    const v = sub.answers ? sub.answers[key] : undefined;
    if(v && counts.hasOwnProperty(v)){ counts[v]++; answered++; }
  });
  const data = options.map((o,i)=>({label:o, value:counts[o], color:DONUT_COLORS[i%DONUT_COLORS.length]}));
  const legend = data.map(d=>{
    const pct = answered ? Math.round((d.value/answered)*100) : 0;
    return `<div class="donut-legend-row">
      <span class="donut-dot" style="background:${d.color}"></span>
      <span class="donut-legend-label">${escapeHtml(d.label)}</span>
      <span class="donut-legend-val">${d.value} <span>(${pct}%)</span></span>
    </div>`;
  }).join("");
  return `
    <div class="kpi-card donut-card">
      <div class="kpi-title">${escapeHtml(title)}</div>
      <div class="donut-row">
        ${svgDonut(data)}
        <div class="donut-legend">${legend}</div>
      </div>
    </div>
  `;
}

function renderAdminOverview(subs){
  const total = subs.length;

  // NPS
  const npsQ = findQuestion(q=>q.type==="scale11");
  let npsHtml = "";
  if(npsQ){
    const key = qKey(npsQ.si, npsQ.qi);
    const vals = subs.map(s=>s.answers?s.answers[key]:undefined).filter(v=>typeof v==="number");
    const promoters = vals.filter(v=>v>=9).length;
    const passives = vals.filter(v=>v>=7&&v<=8).length;
    const detractors = vals.filter(v=>v<=6).length;
    const n = vals.length;
    const nps = n ? Math.round(((promoters-detractors)/n)*100) : 0;
    const pPct = n? (promoters/n*100):0, paPct = n?(passives/n*100):0, dPct = n?(detractors/n*100):0;
    npsHtml = `
      <div class="kpi-card">
        <div class="kpi-title">${escapeHtml(npsQ.q.text)}</div>
        <div class="nps-score ${nps>=0?"pos":"neg"}">${n?nps:"—"}</div>
        <div class="nps-sub">NPS · ${n} respuesta${n===1?"":"s"}</div>
        <div class="nps-stack">
          <div class="nps-seg detractor" style="width:${dPct}%"></div>
          <div class="nps-seg passive" style="width:${paPct}%"></div>
          <div class="nps-seg promoter" style="width:${pPct}%"></div>
        </div>
        <div class="nps-legend">
          <span><i class="dot detractor"></i>Detractores (0–6): ${detractors}</span>
          <span><i class="dot passive"></i>Pasivos (7–8): ${passives}</span>
          <span><i class="dot promoter"></i>Promotores (9–10): ${promoters}</span>
        </div>
      </div>
    `;
  }

  // CSAT (primera escala 1-5 con etiquetas: satisfacción general)
  const csatQ = findQuestion(q=>q.type==="scale5" && q.labels);
  let csatHtml = "";
  if(csatQ){
    const key = qKey(csatQ.si, csatQ.qi);
    const vals = subs.map(s=>s.answers?s.answers[key]:undefined).filter(v=>typeof v==="number");
    const n = vals.length;
    const avg = n ? vals.reduce((a,b)=>a+b,0)/n : 0;
    const maxCount = Math.max(1, ...[1,2,3,4,5].map(v=>vals.filter(x=>x===v).length));
    const bars = [1,2,3,4,5].map(v=>{
      const c = vals.filter(x=>x===v).length;
      const pct = Math.round((c/maxCount)*100);
      return `<div class="admin-bar-row"><div class="admin-bar-label" style="width:110px; flex:none;">${v} · ${escapeHtml(csatQ.q.labels[v-1])}</div><div class="admin-bar-track"><div class="admin-bar-fill" style="width:${pct}%"></div></div><div class="admin-bar-count">${c}</div></div>`;
    }).join("");
    csatHtml = `
      <div class="kpi-card">
        <div class="kpi-title">${escapeHtml(csatQ.q.text)}</div>
        <div class="csat-score">${n?avg.toFixed(2):"—"} <span>/ 5</span></div>
        <div class="admin-bars" style="margin-top:14px;">${bars}</div>
      </div>
    `;
  }

  const siteBlock = renderDonutBlock("Distribución por sede", subs, SITE_KEY, SITE_OPTIONS);
  const roleQ = findQuestion(q=>q.text==="¿Cuál es tu rol?");
  const roleBlock = roleQ ? renderDonutBlock("Distribución por rol", subs, qKey(roleQ.si,roleQ.qi), roleQ.q.options) : "";
  const trainingQ = findQuestion(q=>q.type==="single" && q.options && q.options.length===2 && q.options[0]==="Sí" && q.options[1]==="No");
  const trainingBlock = trainingQ ? renderDonutBlock("¿Recibió training en los últimos 3 meses?", subs, qKey(trainingQ.si,trainingQ.qi), trainingQ.q.options) : "";

  // Respuestas por día
  const byDay = {};
  subs.forEach(s=>{
    const d = new Date(s.ts);
    const label = d.toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
    byDay[label] = (byDay[label]||0)+1;
  });
  const days = Object.keys(byDay);
  const maxDay = Math.max(1, ...Object.values(byDay));
  const trendHtml = days.length ? `
    <div class="kpi-card" style="grid-column:1/-1;">
      <div class="kpi-title">Respuestas recibidas por día</div>
      <div class="admin-bars" style="margin-top:14px;">
        ${days.map(d=>{
          const c = byDay[d];
          const pct = Math.round((c/maxDay)*100);
          return `<div class="admin-bar-row"><div class="admin-bar-label" style="width:70px; flex:none;">${d}</div><div class="admin-bar-track"><div class="admin-bar-fill" style="width:${pct}%"></div></div><div class="admin-bar-count">${c}</div></div>`;
        }).join("")}
      </div>
    </div>
  ` : "";

  return `
    <div class="kpi-grid">
      ${npsHtml}
      ${csatHtml}
      ${siteBlock}
      ${roleBlock}
      ${trainingBlock}
      ${trendHtml}
    </div>
  `;
}

function renderAdminDetail(subs){
  let sectionsHtml = "";
  SECTIONS.forEach((s,sIdx)=>{
    let qBlocks = "";
    s.questions.forEach((q,qIdx)=>{ qBlocks += renderAdminQuestion(sIdx, qIdx, q, subs); });
    sectionsHtml += `
      <div class="admin-section">
        <div class="admin-section-title">${s.label} · ${escapeHtml(s.title)}</div>
        ${qBlocks}
      </div>
    `;
  });
  return sectionsHtml;
}

function renderAdminOpenAnswers(subs){
  const openQs = [];
  SECTIONS.forEach((s,sIdx)=> s.questions.forEach((q,qIdx)=>{ if(q.type==="open") openQs.push({si:sIdx, qi:qIdx, q}); }));

  const options = `<option value="all">Todas las preguntas abiertas</option>` + openQs.map((oq,i)=>
    `<option value="${qKey(oq.si,oq.qi)}">${escapeHtml(oq.q.num?"Pregunta "+oq.q.num+" — ":"")}${escapeHtml(truncate(oq.q.text,70))}</option>`
  ).join("");

  let blocks = "";
  openQs.forEach(oq=>{
    const key = qKey(oq.si,oq.qi);
    const items = subs.map(sub=>{
      const v = sub.answers ? sub.answers[key] : "";
      if(!v || !v.trim()) return null;
      const site = sub.answers ? sub.answers[SITE_KEY] : "";
      return { text:v, site: site||"" };
    }).filter(Boolean);
    blocks += `
      <div class="oa-block" data-qkey="${key}">
        <div class="admin-section-title" style="font-size:15px;">${oq.q.num?"Pregunta "+escapeHtml(oq.q.num)+" — ":""}${escapeHtml(oq.q.text)}</div>
        <div class="oa-count" data-role="count">${items.length} respuesta${items.length===1?"":"s"}</div>
        <div class="oa-items">
          ${items.length ? items.map(it=>`
            <div class="open-answer-item" data-text="${escapeAttr(it.text.toLowerCase())}">
              ${it.site?`<span class="oa-site-tag">${escapeHtml(it.site)}</span>`:""}
              <p>${escapeHtml(it.text)}</p>
            </div>
          `).join("") : `<div class="admin-empty-mini">Sin respuestas aún.</div>`}
        </div>
      </div>
    `;
  });

  return `
    <div class="oa-controls">
      <select id="oa-filter-select" class="admin-input" style="max-width:360px;" onchange="filterOpenAnswers()">${options}</select>
      <input id="oa-search" class="admin-input" style="max-width:280px;" type="text" placeholder="Buscar en las respuestas…" oninput="filterOpenAnswers()">
    </div>
    <div id="oa-container">${blocks}</div>
  `;
}

function filterOpenAnswers(){
  const selectEl = document.getElementById("oa-filter-select");
  const searchEl = document.getElementById("oa-search");
  const selected = selectEl ? selectEl.value : "all";
  const search = searchEl ? searchEl.value.trim().toLowerCase() : "";

  document.querySelectorAll(".oa-block").forEach(block=>{
    const showBlock = selected === "all" || block.getAttribute("data-qkey") === selected;
    block.style.display = showBlock ? "" : "none";
    if(!showBlock) return;
    let visibleCount = 0;
    block.querySelectorAll(".open-answer-item").forEach(item=>{
      const text = item.getAttribute("data-text") || "";
      const match = !search || text.includes(search);
      item.style.display = match ? "" : "none";
      if(match) visibleCount++;
    });
    const counter = block.querySelector('[data-role="count"]');
    if(counter) counter.textContent = visibleCount + " respuesta" + (visibleCount===1?"":"s") + (search?" (filtradas)":"");
  });
}

function truncate(str, n){ return str.length>n ? str.slice(0,n-1)+"…" : str; }

function renderAdminQuestion(sIdx, qIdx, q, subs){
  const key = qKey(sIdx,qIdx);
  const values = subs.map(sub => sub.answers ? sub.answers[key] : undefined).filter(v => v!==undefined && v!==null && v!=="" && !(Array.isArray(v)&&v.length===0));
  const answeredN = values.length;
  let body = "";

  if(q.type === "single" || q.type === "multi"){
    const counts = {};
    q.options.forEach(o=>counts[o]=0);
    values.forEach(v=>{
      if(Array.isArray(v)) v.forEach(o=>{ counts[o]=(counts[o]||0)+1; });
      else counts[v]=(counts[v]||0)+1;
    });
    const max = Math.max(1, ...Object.values(counts));
    body = `<div class="admin-bars">` + q.options.map(o=>{
      const c = counts[o]||0;
      const pct = Math.round((c/max)*100);
      const pctOfTotal = answeredN ? Math.round((c/answeredN)*100) : 0;
      return `<div class="admin-bar-row">
        <div class="admin-bar-label">${escapeHtml(o)}</div>
        <div class="admin-bar-track"><div class="admin-bar-fill" style="width:${pct}%"></div></div>
        <div class="admin-bar-count">${c} <span>(${pctOfTotal}%)</span></div>
      </div>`;
    }).join("") + `</div>`;

    if(q.options.includes("Otro") || q.options.includes("Otra")){
      const others = subs.map(sub => sub.other ? sub.other[key] : "").filter(t=>t && t.trim()!=="");
      if(others.length){
        body += `<div class="admin-open-list"><div class="admin-open-title">Especificaciones de "Otro" (${others.length})</div>` +
          others.map(t=>`<div class="admin-open-item">${escapeHtml(t)}</div>`).join("") + `</div>`;
      }
    }
  }
  else if(q.type === "scale5" || q.type === "scale11"){
    const max = q.type === "scale5" ? 5 : 10;
    const min = q.type === "scale5" ? 1 : 0;
    const counts = {};
    for(let n=min;n<=max;n++) counts[n]=0;
    values.forEach(v=>{ counts[v]=(counts[v]||0)+1; });
    const avg = answeredN ? (values.reduce((a,b)=>a+b,0)/answeredN) : 0;
    const maxCount = Math.max(1, ...Object.values(counts));
    body = `<div class="admin-avg">Promedio: <b>${answeredN? avg.toFixed(2):"—"}</b> / ${max}</div>`;
    body += `<div class="admin-bars">` + Object.keys(counts).map(n=>{
      const c = counts[n];
      const pct = Math.round((c/maxCount)*100);
      return `<div class="admin-bar-row">
        <div class="admin-bar-label" style="width:26px; flex:none;">${n}</div>
        <div class="admin-bar-track"><div class="admin-bar-fill" style="width:${pct}%"></div></div>
        <div class="admin-bar-count">${c}</div>
      </div>`;
    }).join("") + `</div>`;
  }
  else if(q.type === "open"){
    if(values.length){
      body = `<div class="admin-open-list">` + values.map(t=>`<div class="admin-open-item">${escapeHtml(t)}</div>`).join("") + `</div>`;
    } else {
      body = `<div class="admin-empty-mini">Sin respuestas aún.</div>`;
    }
  }

  return `
    <div class="admin-qcard">
      <div class="admin-qhead">
        <div class="admin-qnum">${q.num ? "Pregunta "+escapeHtml(q.num) : "Pregunta"}</div>
        <div class="admin-qanswered">${answeredN} respuesta${answeredN===1?"":"s"}</div>
      </div>
      <p class="admin-qtext">${escapeHtml(q.text)}</p>
      ${body}
    </div>
  `;
}

function questionLabel(sIdx, qIdx, q){ return "S"+(sIdx+1)+(q.num?" · P"+q.num:" · Q"+(qIdx+1)); }

function exportJSON(){
  const data = JSON.stringify(adminSubmissions || [], null, 2);
  downloadFile(data, "respuestas_training.json", "application/json");
}

function exportCSV(){
  const subs = adminSubmissions || [];
  const cols = [];
  SECTIONS.forEach((s,sIdx)=> s.questions.forEach((q,qIdx)=> cols.push({sIdx,qIdx,label:questionLabel(sIdx,qIdx,q)}) ));
  const header = ["timestamp"].concat(cols.map(c=>c.label));
  const rows = [header];
  subs.forEach(sub=>{
    const row = [new Date(sub.ts).toISOString()];
    cols.forEach(c=>{
      const key = qKey(c.sIdx, c.qIdx);
      let v = sub.answers ? sub.answers[key] : "";
      if(Array.isArray(v)) v = v.join(" | ");
      if(v===undefined || v===null) v = "";
      const other = sub.other ? sub.other[key] : "";
      if(other) v = String(v) + " (" + other + ")";
      row.push(csvEscape(String(v)));
    });
    rows.push(row);
  });
  const csv = rows.map(r=>r.join(",")).join("\r\n");
  downloadFile(csv, "respuestas_training.csv", "text/csv");
}

function csvEscape(v){ if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"'; return v; }

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================
   UTILS
   ========================================================= */
function escapeHtml(str){ return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,"&quot;"); }
function escapeJs(str){ return String(str).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

render();
</script>
