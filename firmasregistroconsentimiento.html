        .catch(e => { say("No se pudo guardar en Google Sheets (" + BY_ID[id].nombre + "): " + (e && e.message || e) + ". Revisa la conexión e inténtalo de nuevo.", true); return false; })
        .finally(() => setPending(p => p - 1));
      chains.current[id] = run;
      return run;
    }
    if (mode === "db" && dbRef.current) {
      setPending(p => p + 1);
      const prev = chains.current[id] || Promise.resolve();
      const run = prev.then(() => dbRef.current.collection("consents").doc(id).set(body))
        .then(() => { setLastSave(new Date()); return true; })
        .catch(e => {
          if (e && e.code === "invalid_argument") { setReadOnly(true); say("No tienes permiso para modificar registros en esta herramienta. El cambio no se guardó.", true); }
          else if (e && e.code === "quota_exceeded") say("Se alcanzó el límite de almacenamiento. El cambio no se guardó.", true);
          else say("No se pudo guardar el cambio de " + BY_ID[id].nombre + ". Inténtalo de nuevo.", true);
          return false;
        })
        .finally(() => setPending(p => p - 1));
      chains.current[id] = run;
      return run;
    }
    if (mode === "local") {
      try {
        localRef.current[id] = body;
        localStorage.setItem(LS_KEY, JSON.stringify(localRef.current));
        setLastSave(new Date());
        return Promise.resolve(true);
      } catch (e) { setMode("memory"); say("El navegador no permitió guardar. Exporta un respaldo JSON para no perder cambios.", true); return Promise.resolve(false); }
    }
    return Promise.resolve(true);
  }, [mode, say]);

  /* Envío en lote (importación y subida de registros locales) */
  const pushList = useCallback(async (list, origen) => {
    if (!list.length) return 0;
    if (mode !== "sheets") { let f = 0; for (const it of list) { const ok = await writeRec(it.id, it.body); if (ok === false) f++; } return f; }
    setRecs(r => { const n = { ...r }; list.forEach(it => n[it.id] = it.body); return n; });
    setPending(p => p + 1);
    let fails = 0, skipped = 0;
    try {
      for (let i = 0; i < list.length; i += 50) {
        const chunk = list.slice(i, i + 50);
        try { const j = await sheetsUpsert(cfgRef.current, chunk.map(it => withRoster(it.id, it.body)), origen || "importacion"); skipped += (j.skipped || []).length; }
        catch (e) { fails += chunk.length; }
      }
    } finally { setPending(p => p - 1); }
    setLastSave(new Date());
    if (skipped || fails) setReloadKey(k => k + 1);
    say(fails ? fails + " registros no se pudieron enviar a la hoja." : "Enviados " + (list.length - skipped) + " registros a Google Sheets" + (skipped ? " (" + skipped + " ya tenían un cambio más reciente)" : ""), !!fails);
    return fails;
  }, [mode, writeRec, say]);

  pushRef.current = pushList;
  const entry = (accion, fecha) => ({ ts: new Date().toISOString(), accion, fecha: fecha || "", por: meRef.current || null });

  const markSigned = (id, d) => {
    const cur = recs[id] || EMPTY;
    const f = today();
    const body = { ...cur, [d.est]: "firmado", [d.fec]: f, actualizado: new Date().toISOString(), historial: [...cur.historial, entry(d.short + ": marcado como firmado", f)].slice(-HIST_MAX) };
    writeRec(id, body).then(ok => { if (ok || mode !== "db") say(d.short + " registrado: " + BY_ID[id].nombre + (isComplete(body, BY_ID[id].area) ? " · firmas completas" : "")); });
  };
  const doRevert = (id, d) => {
    const cur = recs[id] || EMPTY;
    const body = { ...cur, [d.est]: "pendiente", [d.fec]: "", actualizado: new Date().toISOString(), historial: [...cur.historial, entry(d.short + ": revertido a pendiente", cur[d.fec])].slice(-HIST_MAX) };
    writeRec(id, body).then(ok => { if (ok || mode !== "db") say(d.short + " de " + BY_ID[id].nombre + " regresó a pendiente"); });
  };
  const askRevert = (id, d) => setConfirm({
    title: "¿Revertir firma registrada?",
    msg: html`<p style=${{margin:0}}><b>${BY_ID[id].nombre}</b> tiene registrada la firma de <b>${d.label}</b>${recs[id]?.[d.fec] ? " el " + fmtDate(recs[id][d.fec]) : ""}. Volverá a "Pendiente de firma" y la fecha se quitará. El cambio queda en el historial.</p>`,
    label: "Revertir a pendiente", danger: true, onOk: () => doRevert(id, d)
  });
  const setEstado = (id, d, est) => {
    if (readOnly) return;
    const cur = (recs[id] || EMPTY)[d.est];
    if (cur === est) return;
    if (est === "firmado") markSigned(id, d); else askRevert(id, d);
  };

  /* Alta y baja de colaboradores agregados */
  const addPerson = async (p) => {
    const id = newExtraId();
    const now = new Date().toISOString();
    const h = [entry("Colaborador agregado", "")];
    const body = { ...EMPTY, nombre: p.nombre, area: p.area, cargo: p.cargo, obs: p.obs, actualizado: now };
    reqDocs(p.area).forEach(d => { if (p.firmas[d.k]) { body[d.est] = "firmado"; body[d.fec] = p.fecha; h.push(entry(d.short + ": marcado como firmado", p.fecha)); } });
    body.historial = h;
    EXTRA[id] = { id, nombre: p.nombre, area: p.area, cargo: p.cargo, agregado: true }; rebuildRoster();
    const ok = await writeRec(id, body);
    if (ok !== false) say("Colaborador agregado: " + p.nombre);
    return id;
  };
  const deletePerson = (id) => {
    const r = BY_ID[id]; if (!r || !isExtraId(id)) return;
    setConfirm({ title: "¿Eliminar colaborador agregado?", danger: true, label: "Eliminar",
      msg: html`<p style=${{margin:0}}>Se quitará a <b>${r.nombre}</b> (${r.area}) de la lista y de los indicadores. ${mode === "sheets" ? "También se borra su fila en la hoja; la baja queda en la Bitacora." : ""} Esta acción no se puede deshacer.</p>`,
      onOk: async () => {
        try {
          if (mode === "sheets") await sheetsDelete(cfgRef.current, id);
          else if (mode === "db" && dbRef.current) await dbRef.current.collection("consents").doc(id).delete();
          else if (mode === "local") { delete localRef.current[id]; try { localStorage.setItem(LS_KEY, JSON.stringify(localRef.current)); } catch (e) {} }
          setRecs(rr => { const n = { ...rr }; delete n[id]; return n; });
          removeExtra(id); setOpenId(null);
          say("Colaborador eliminado: " + r.nombre);
        } catch (e) { say("No se pudo eliminar: " + (e && e.message || e), true); }
      } });
  };

  /* Derivados */
  const stat = useMemo(() => {
    const mk = () => ({ total: 0, c: 0, cReq: 0, d: 0, dReq: 0, comp: 0 });
    const byArea = {}; AREAS.forEach(a => byArea[a] = mk());
    const t = mk();
    ROSTER.forEach(r => {
      const c = recs[r.id] || EMPTY;
      const apC = applies(r.area, DOC.c), apD = applies(r.area, DOC.d);
      [t, byArea[r.area]].forEach(o => { o.total++; if (apC) { o.cReq++; if (isSigned(c, DOC.c)) o.c++; } if (apD) { o.dReq++; if (isSigned(c, DOC.d)) o.d++; } if (isComplete(c, r.area)) o.comp++; });
    });
    const fin = o => { o.firmas = o.c + o.d; o.req = o.cReq + o.dReq; o.pc = pct(o.firmas, o.req); o.pend = o.total - o.comp; return o; };
    AREAS.forEach(a => fin(byArea[a]));
    return { ...fin(t), byArea };
  }, [recs]);

  const cargos = useMemo(() => [...new Set(ROSTER.filter(r => !fArea || r.area === fArea).map(r => r.cargo))].sort((a, b) => a.localeCompare(b, "es")), [fArea, recs]);
  useEffect(() => { if (fCargo && !cargos.includes(fCargo)) setFCargo(""); }, [cargos]);

  const ESTADOS = [["todos", "Todos"], ["completos", "Firmas completas"], ["pendientes", "Con alguna firma pendiente"], ["falta_c", "Falta Firma de las formas"], ["falta_d", "Falta Dirección del abogado"], ["ninguna", "Sin ninguna firma"]];
  const passEstado = (c, f, area) => f === "todos" ? true : f === "completos" ? isComplete(c, area) : f === "pendientes" ? !isComplete(c, area)
    : f === "falta_c" ? applies(area, DOC.c) && !isSigned(c, DOC.c) : f === "falta_d" ? applies(area, DOC.d) && !isSigned(c, DOC.d) : nSigned(c, area) === 0;

  const rows = useMemo(() => {
    const nq = norm(q).split(/\s+/).filter(Boolean);
    let list = ROSTER.filter(r => {
      const c = recs[r.id] || EMPTY;
      if (fArea && r.area !== fArea) return false;
      if (fCargo && r.cargo !== fCargo) return false;
      if (!passEstado(c, fEstado, r.area)) return false;
      if (nq.length) { const n = norm(r.nombre); if (!nq.every(t => n.includes(t))) return false; }
      return true;
    });
    const k = sort.key, dir = sort.dir;
    const docKey = (c, d) => (isSigned(c, d) ? "1" + (c[d.fec] || "0") : "0");
    list = list.slice().sort((a, b) => {
      let va, vb; const ca = recs[a.id] || EMPTY, cb = recs[b.id] || EMPTY;
      if (DOC[k]) { va = docKey(ca, DOC[k]); vb = docKey(cb, DOC[k]); }
      else { va = a[k]; vb = b[k]; }
      const c = String(va).localeCompare(String(vb), "es");
      return c !== 0 ? c * dir : a.nombre.localeCompare(b.nombre, "es");
    });
    return list;
  }, [recs, q, fArea, fCargo, fEstado, sort]);

  const filtersOn = q || fArea || fCargo || fEstado !== "todos";
  const clearFilters = () => { setQ(""); setFArea(""); setFCargo(""); setFEstado("todos"); };
  const goArea = a => { setFArea(a); setFCargo(""); setQ(""); setFEstado("todos"); setTab("colab"); window.scrollTo({ top: 0, behavior: "smooth" }); };

  /* Exportación */
  const saveFile = async (filename, data) => {
    const dl = dlRef.current;
    if (dl) {
      try { await dl.save({ filename, data }); say("Archivo listo: " + filename); return; }
      catch (e) { if (e && e.code === "declined") return; if (e && e.code === "rate_limited") { say("Ya hay una descarga esperando confirmación.", true); return; } }
    }
    if (!window.claude) {
      try {
        const type = filename.endsWith(".json") ? "application/json" : "text/csv;charset=utf-8";
        const url = URL.createObjectURL(new Blob([data], { type }));
        const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000); say("Archivo descargado: " + filename); return;
      } catch (e) {}
    }
    setCopyFallback({ title: filename, text: typeof data === "string" ? data.replace(/^﻿/, "") : "", note: "Este visor no permite descargar archivos. Copia el contenido y pégalo en un archivo con el nombre indicado." });
  };
  const estTxt = (c, d) => isSigned(c, d) ? "Firmado" : "Pendiente de firma";
  const recRow = r => { const c = recs[r.id] || EMPTY; return [r.id, r.nombre, r.area, r.cargo,
    ...DOCS.flatMap(d => applies(r.area, d) ? [estTxt(c, d), fmtDate(c[d.fec]), c[d.enl]] : ["No aplica", "", ""]),
    isComplete(c, r.area) ? "Completo" : nSigned(c, r.area) ? "Parcial" : "Sin firmas", c.obs, fmtTs(c.actualizado), r.agregado ? "Agregado" : "Plantilla"]; };
  const HEAD = ["ID", "Nombre", "Área", "Cargo", ...DOCS.flatMap(d => [d.short + " - Estado", d.short + " - Fecha de firma", d.short + " - Enlace"]), "Estatus general", "Observaciones", "Última actualización", "Origen"];
  const stamp = today();
  const exportCsv = which => {
    const list = ROSTER.filter(r => passEstado(recs[r.id] || EMPTY, which, r.area));
    saveFile("Firmas_" + which + "_" + stamp + ".csv", toCsv([HEAD, ...list.map(recRow)]));
  };
  const exportAreas = () => {
    const out = [["Área", "Total", "Firma de las formas firmados", "Firma de las formas pendientes", "Dirección del abogado firmados", "Dirección del abogado pendientes", "Firmas completas", "Con alguna pendiente", "% cumplimiento (firmas registradas / requeridas)"]];
    const line = (a, s) => [a, s.total, s.cReq ? s.c : "No aplica", s.cReq ? s.cReq - s.c : "No aplica", s.dReq ? s.d : "No aplica", s.dReq ? s.dReq - s.d : "No aplica", s.comp, s.pend, s.total ? fmtPct(s.pc) : "Sin colaboradores"];
    AREAS.forEach(a => out.push(line(a, stat.byArea[a])));
    out.push(line("TOTAL", stat));
    out.push([]); out.push(["Generado", fmtTs(new Date().toISOString())]);
    saveFile("Firmas_reporte_por_area_" + stamp + ".csv", toCsv(out));
  };
  const exportJson = () => {
    const data = { app: APP, version: 2, documentos: DOCS.map(d => d.label), exportado: new Date().toISOString(), total: ROSTER.length,
      registros: ROSTER.map(r => ({ ...(recs[r.id] || EMPTY), id: r.id, nombre: r.nombre, area: r.area, cargo: r.cargo, agregado: !!r.agregado })) };
    saveFile("Firmas_respaldo_" + stamp + ".json", JSON.stringify(data, null, 2));
  };

  /* Pendientes por área (texto para portapapeles) */
  const pendText = useMemo(() => {
    const lines = ["PENDIENTES DE FIRMA — FIRMA DE LAS FORMAS Y DIRECCIÓN DEL ABOGADO", "The Mendoza Law Firm · corte " + fmtDate(today()),
      "Personas con firmas pendientes: " + stat.pend + " de " + stat.total + " · Falta Firma de las formas: " + (stat.cReq - stat.c) + " · Falta Dirección del abogado: " + (stat.dReq - stat.d), ""];
    AREAS.forEach(a => {
      const l = ROSTER.filter(r => r.area === a && !isComplete(recs[r.id] || EMPTY, r.area));
      if (!l.length) return;
      lines.push(a + " (" + l.length + ")");
      l.forEach(r => { const c = recs[r.id] || EMPTY; lines.push("• " + r.nombre + " — " + r.cargo + " · Falta: " + reqDocs(r.area).filter(d => !isSigned(c, d)).map(d => d.short).join(" y ")); });
      lines.push("");
    });
    return lines.join("\n").trim();
  }, [recs, stat]);
  const copyPend = async () => {
    if (await copyText(pendText)) say("Lista de pendientes copiada (" + stat.pend + " personas)");
    else setCopyFallback({ title: "Lista de pendientes", text: pendText, note: "No se pudo copiar automáticamente. Selecciona el texto y cópialo." });
  };

  /* Estado del almacenamiento */
  let storeTxt, dotCls;
  if (mode === "loading") { storeTxt = "Conectando…"; dotCls = "busy"; }
  else if (mode === "db") {
    if (readOnly) { storeTxt = "Solo lectura"; dotCls = "warn"; }
    else if (pending > 0) { storeTxt = "Guardando…"; dotCls = "busy"; }
    else { storeTxt = lastSave ? "Guardado " + pad(lastSave.getHours()) + ":" + pad(lastSave.getMinutes()) + " · compartido" : "Almacenamiento compartido activo"; dotCls = "ok"; }
  } else if (mode === "sheets") {
    if (pending > 0) { storeTxt = "Guardando en Google Sheets…"; dotCls = "busy"; }
    else { storeTxt = lastSave ? "Google Sheets · guardado " + pad(lastSave.getHours()) + ":" + pad(lastSave.getMinutes()) : "Conectado a Google Sheets"; dotCls = "ok"; }
  } else if (mode === "local") { storeTxt = sheetErr ? "Sin conexión con la hoja" : "Solo en este navegador"; dotCls = sheetErr ? "bad" : "warn"; }
  else { storeTxt = "Sin almacenamiento"; dotCls = "bad"; }

  const TABS = [["panel", "Panel por área"], ["colab", "Colaboradores", stat.total], ["pend", "Pendientes de seguimiento", stat.pend], ["resp", "Exportar y respaldo"]];
  const docCount = d => d.k === "c" ? stat.c : stat.d;
  const docTotal = d => d.k === "c" ? stat.cReq : stat.dReq;

  const DocCell = ({ r, c, d }) => { const f = isSigned(c, d); return html`<div className="dcell">
    <div className="toggle" role="group" aria-label=${d.label + " de " + r.nombre}>
      <button className=${"p" + (!f ? " on" : "")} aria-pressed=${!f} disabled=${readOnly} onClick=${() => setEstado(r.id, d, "pendiente")}>Pendiente</button>
      <button className=${"f" + (f ? " on" : "")} aria-pressed=${f} disabled=${readOnly} onClick=${() => setEstado(r.id, d, "firmado")}>${f ? "✓ Firmado" : "Firmado"}</button>
    </div>
    <span className="dfecha num">${f ? (c[d.fec] ? fmtDate(c[d.fec]) : "Sin fecha") : "—"}</span></div>`; };

  return html`
  <header className="mast">
    <div className="wrap">
      <div className="mast-top">
        <div>
          <div className="firm">THE MENDOZA LAW FIRM</div>
          <h1>Control de Firmas</h1>
          <div className="docs-sub">Firma de las formas (todas las áreas excepto ${FORMAS_EXCLUIDAS.length}) · Dirección del abogado (todas las áreas)</div>
        </div>
        <span className="store" role="status"><span className=${"dot " + dotCls}></span>${storeTxt}</span>
      </div>
      <div className="kpis">
        <div className="kpi"><div className="lbl">TOTAL DE COLABORADORES</div><div className="val num">${stat.total}</div><div className="sub num">${stat.comp} con firmas completas</div></div>
        ${DOCS.map(d => html`<div key=${d.k} className="kpi g"><div className="lbl">${d.label.toUpperCase()}</div><div className="val num">${docCount(d)}</div><div className="sub num">firmados · ${docTotal(d) - docCount(d)} pendientes${docTotal(d) < stat.total ? " de " + docTotal(d) + " que aplican" : ""}</div></div>`)}
        <div className="kpi"><div className="lbl">PENDIENTES DE FIRMA</div><div className="val num">${stat.pend}</div><div className="sub">personas con al menos una firma pendiente</div></div>
        <div className="kpi"><div className="lbl">PORCENTAJE DE CUMPLIMIENTO</div><div className="val num">${fmtPct(stat.pc)}</div><div className="sub num">${stat.firmas} de ${stat.req} firmas</div></div>
      </div>
      <div className="prog">
        ${DOCS.map(d => { const p = pct(docCount(d), docTotal(d)); return html`<div key=${d.k} className="prog-item">
          <div className="prog-row"><span>${d.label}${docTotal(d) < stat.total ? " · áreas que aplican" : ""}</span><span className="num">${docCount(d)} de ${docTotal(d)} · ${fmtPct(p)}</span></div>
          <div className="bar" role="progressbar" aria-label=${d.label} aria-valuemin="0" aria-valuemax="100" aria-valuenow=${p}><i style=${{ width: p + "%" }}></i></div></div>`; })}
      </div>
      <nav className="tabs" role="tablist">
        ${TABS.map(([k, l, c]) => html`<button key=${k} id=${"tab-" + k} className="tab" role="tab" aria-selected=${tab === k} onClick=${() => setTab(k)}>${l}${c != null ? html`<span className="cnt num">${c}</span>` : null}</button>`)}
      </nav>
    </div>
  </header>

  <main className="wrap">
    ${mode === "local" && sheetErr ? html`<div className="notice bad"><span>⚠</span><div><b>No se pudo conectar con Google Sheets</b> (${sheetErr}). Estás trabajando con la copia de este navegador; al recuperar la conexión se te ofrecerá enviar estos cambios a la hoja. <button className="btn sm" onClick=${() => setReloadKey(k => k + 1)}>Reintentar</button></div></div>` : null}
    ${mode === "local" && !sheetErr ? html`<div className="notice warn"><span>⚠</span><div><b>Los cambios se guardan solo en este navegador.</b> No se comparten con otras personas ni otros equipos y se pierden si se borran los datos del navegador. Exporta un respaldo JSON al terminar cada sesión de captura, o conecta Google Sheets en la pestaña "Exportar y respaldo".</div></div>` : null}
    ${mode === "memory" ? html`<div className="notice bad"><span>⚠</span><div><b>Este navegador no permite guardar.</b> Los cambios desaparecerán al cerrar la página. Exporta un respaldo JSON antes de salir e impórtalo la próxima vez.</div></div>` : null}
    ${mode === "db" && readOnly ? html`<div className="notice warn"><span>🔒</span><div><b>Modo de solo lectura.</b> Puedes consultar y exportar, pero tu nivel de acceso no permite registrar firmas. Pide acceso de colaborador a quien administra la herramienta.</div></div>` : null}

    ${tab === "panel" ? html`
      <div className="sec-h"><div><h2>Avance por área</h2><p>Dirección del abogado aplica para todas las áreas; Firma de las formas no aplica para ${FORMAS_EXCLUIDAS.join(", ")}. Selecciona un área para ver a sus colaboradores.</p></div>${readOnly ? null : html`<button className="btn pri" onClick=${() => setAdding(true)}>+ Agregar colaborador</button>`}</div>
      <div className="areas">
        ${AREAS.map(a => { const s = stat.byArea[a]; const nd = reqDocs(a).length;
          if (!s.total) return html`<div key=${a} className="acard empty-area">
            <div className="top"><span className="nm">${a}</span><span className="doctag">${nd} ${nd === 1 ? "documento" : "documentos"}</span></div>
            <p className="muted" style=${{margin:0,fontSize:"12.5px"}}>Sin colaboradores registrados todavía.</p>
            ${readOnly ? null : html`<button className="btn sm" style=${{alignSelf:"flex-start"}} onClick=${() => setAdding(a)}>+ Agregar a ${a}</button>`}
          </div>`;
          return html`
          <button key=${a} className=${"acard" + (s.comp === s.total ? " done" : "")} onClick=${() => goArea(a)}>
            <div className="top"><span className="nm">${a}</span><span className="pc num">${fmtPct(s.pc)}</span></div>
            <span className="doctag">${nd} ${nd === 1 ? "documento" : "documentos"}</span>
            ${DOCS.map(d => { if (!applies(a, d)) return html`<div key=${d.k} className="drow na"><div className="drow-l"><span>${d.short}</span><span>No aplica</span></div></div>`;
              const n = d.k === "c" ? s.c : s.d; const p = pct(n, s.total); return html`<div key=${d.k} className="drow">
              <div className="drow-l"><span>${d.short}</span><span className="num">${n}/${s.total}</span></div>
              <div className="mbar"><i style=${{ width: p + "%" }}></i></div></div>`; })}
            <div className="meta num"><span><b>${s.total}</b> total</span><span><b>${s.comp}</b> completos</span><span><b>${s.pend}</b> con pendientes</span></div>
          </button>`; })}
      </div>
      <p className="foot">Marcar un documento como "Firmado" es un registro administrativo de confirmación. No constituye una firma electrónica ni demuestra por sí solo que exista un documento firmado; los documentos deben resguardarse en el repositorio autorizado de la firma. El porcentaje de cumplimiento cuenta las firmas registradas sobre las requeridas: Dirección del abogado para cada colaborador, más Firma de las formas en las áreas donde aplica.</p>
    ` : null}

    ${tab === "colab" ? html`
      <div className="filters">
        <label className="fld search"><span>Buscar</span><input id="f-q" className="inp" type="search" placeholder="Nombre o apellido" value=${q} onChange=${e => setQ(e.target.value)} /></label>
        <label className="fld"><span>Área</span><select id="f-area" className="sel" value=${fArea} onChange=${e => setFArea(e.target.value)}><option value="">Todas las áreas</option>${AREAS.map(a => html`<option key=${a} value=${a}>${a}</option>`)}</select></label>
        <label className="fld"><span>Cargo</span><select id="f-cargo" className="sel" value=${fCargo} onChange=${e => setFCargo(e.target.value)}><option value="">Todos los cargos</option>${cargos.map(c => html`<option key=${c} value=${c}>${c}</option>`)}</select></label>
        <label className="fld"><span>Estado de firmas</span><select id="f-estado" className="sel" value=${fEstado} onChange=${e => setFEstado(e.target.value)}>${ESTADOS.map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select></label>
        <button className="btn" onClick=${clearFilters} disabled=${!filtersOn}>Limpiar filtros</button>
        ${readOnly ? null : html`<button className="btn pri" onClick=${() => setAdding(true)}>+ Agregar colaborador</button>`}
      </div>
      <div className="resline"><span className="num">Mostrando <b>${rows.length}</b> de ${stat.total} colaboradores${fArea ? html`<span className="chipf">Área: ${fArea}</span>` : null}</span>
        <span className="num">${(() => { const f = rows.filter(r => isComplete(recs[r.id] || EMPTY, r.area)).length; return html`En esta vista: <b style=${{color:"var(--green)"}}>${f}</b> con firmas completas · <b>${rows.length - f}</b> con pendientes`; })()}</span></div>
      <div className="tbox">
        <table>
          <thead><tr>
            ${[["nombre","Nombre completo"],["area","Área"],["cargo","Cargo"],["c","Firma de las formas"],["d","Dirección del abogado"]].map(([k,l]) => html`<th key=${k} aria-sort=${sort.key === k ? (sort.dir > 0 ? "ascending" : "descending") : "none"}><button className="sort" onClick=${() => setSort(s => ({ key: k, dir: s.key === k ? -s.dir : 1 }))}>${l}<span aria-hidden="true">${sort.key === k ? (sort.dir > 0 ? "▲" : "▼") : "↕"}</span></button></th>`)}
            <th><span className="plain">Observaciones</span></th><th><span className="plain">Acciones</span></th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => { const c = recs[r.id] || EMPTY; const n = nSigned(c, r.area); return html`
              <tr key=${r.id} className=${n === reqDocs(r.area).length ? "signed" : n ? "partial" : ""}>
                <td><button className="nmbtn" onClick=${() => setOpenId(r.id)}>${r.nombre}</button><span className="idt">${r.id}${r.agregado ? html` <span className="newtag">Agregado</span>` : null}</span></td>
                <td><span className="area-tag">${r.area}</span></td>
                <td><div className="cargo">${r.cargo}</div></td>
                ${DOCS.map(d => html`<td key=${d.k}>${applies(r.area, d) ? DocCell({ r, c, d }) : html`<span className="na-cell">No aplica</span>`}</td>`)}
                <td><div className="obs" title=${c.obs}>${c.obs || html`<span className="muted">—</span>`}</div></td>
                <td><button className="btn sm" onClick=${() => setOpenId(r.id)}>${readOnly ? "Ver" : "Ver / editar"}</button></td>
              </tr>`; }) : html`<tr><td colSpan="7"><div className="empty">Ningún colaborador coincide con estos filtros. <button className="btn sm" onClick=${clearFilters}>Limpiar filtros</button></div></td></tr>`}
          </tbody>
        </table>
      </div>
    ` : null}

    ${tab === "pend" ? html`
      <div className="sec-h"><div><h2>Pendientes de seguimiento</h2><p className="num">${stat.pend} colaboradores con al menos una firma pendiente · faltan ${stat.cReq - stat.c} de Firma de las formas y ${stat.dReq - stat.d} de Dirección del abogado.</p></div>
        <button className="btn pri" onClick=${copyPend} disabled=${!stat.pend}>Copiar lista por área</button></div>
      ${stat.pend === 0 ? html`<div className="alldone">Todos los colaboradores tienen sus firmas registradas.</div>` : html`
      <div className="pgrid">
        ${AREAS.map(a => { const l = ROSTER.filter(r => r.area === a && !isComplete(recs[r.id] || EMPTY, r.area)); if (!l.length) return null; return html`
          <section key=${a} className="pgroup">
            <h3><span>${a}</span><span className="num muted">${l.length} de ${stat.byArea[a].total}</span></h3>
            <ul>${l.map(r => { const c = recs[r.id] || EMPTY; return html`<li key=${r.id}><div className="who"><b>${r.nombre}</b><span>${r.cargo}</span>
                <div className="miss">${reqDocs(r.area).map(d => html`<span key=${d.k} className=${"pill " + (isSigned(c, d) ? "f" : "p")}>${isSigned(c, d) ? "✓ " : ""}${d.short}</span>`)}</div></div>
              ${readOnly ? null : html`<div className="regs">${reqDocs(r.area).filter(d => !isSigned(c, d)).map(d => html`<button key=${d.k} className="btn sm" onClick=${() => setEstado(r.id, d, "firmado")}>Registrar ${d.short}</button>`)}</div>`}</li>`; })}</ul>
          </section>`; })}
      </div>`}
    ` : null}

    ${tab === "resp" ? html`<${Respaldo} recs=${recs} mode=${mode} readOnly=${readOnly} exportCsv=${exportCsv} exportAreas=${exportAreas} exportJson=${exportJson} stat=${stat} writeRec=${writeRec} pushList=${pushList} say=${say} setConfirm=${setConfirm} meRef=${meRef} cfg=${cfg} setCfg=${setCfg} sheetErr=${sheetErr} reload=${() => setReloadKey(k => k + 1)} />` : null}
  </main>

  ${adding ? html`<${AddPerson} presetArea=${typeof adding === "string" ? adding : ""} onClose=${() => setAdding(false)} onSave=${async p => { await addPerson(p); setAdding(false); }} />` : null}
  ${openId && BY_ID[openId] ? html`<${Ficha} key=${openId} id=${openId} rec=${recs[openId] || EMPTY} readOnly=${readOnly} onDelete=${deletePerson} names=${names} onClose=${() => setOpenId(null)} writeRec=${writeRec} say=${say} setConfirm=${setConfirm} meRef=${meRef} />` : null}
  ${confirm ? html`<${Confirm} ...${confirm} onClose=${() => setConfirm(null)} />` : null}
  ${copyFallback ? html`<${CopyBox} ...${copyFallback} onClose=${() => setCopyFallback(null)} />` : null}
  ${toast ? html`<div key=${toast.k} className=${"toast" + (toast.bad ? " bad" : "")} role="status">${toast.msg}</div>` : null}
  `;
}

/* ---------- Ficha individual ---------- */
function Ficha({ id, rec, readOnly, names, onClose, writeRec, say, setConfirm, meRef, onDelete }){
  const r = BY_ID[id];
  const extra = !!r.agregado;
  const [nombre, setNombre] = useState(r.nombre);
  const [area, setArea] = useState(r.area);
  const [cargo, setCargo] = useState(r.cargo);
  const nNombre = normName(nombre), nArea = normName(area), nCargo = normName(cargo);
  const dupe = extra && nNombre !== r.nombre ? ROSTER.find(x => x.id !== id && norm(x.nombre) === norm(nNombre)) : null;
  const idOk = !extra || (nNombre.length >= 5 && nArea && nCargo && !dupe);
  const idDirty = extra && (nNombre !== r.nombre || nArea !== r.area || nCargo !== r.cargo);
  const init = k => Object.fromEntries(DOCS.map(d => [d.k, rec[d[k]] || ""]));
  const [est, setEst] = useState(() => Object.fromEntries(DOCS.map(d => [d.k, rec[d.est] === "firmado" ? "firmado" : "pendiente"])));
  const [fec, setFec] = useState(() => init("fec"));
  const [enl, setEnl] = useState(() => init("enl"));
  const [obs, setObs] = useState(rec.obs || "");
  const [saving, setSaving] = useState(false);
  useEffect(() => { const k = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  const changeEst = (d, v) => { setEst(s => ({ ...s, [d.k]: v })); if (v === "firmado" && !fec[d.k]) setFec(s => ({ ...s, [d.k]: today() })); };
  const prob = d => {
    if (!isUrl(enl[d.k])) return "url";
    if (est[d.k] === "firmado" && !fec[d.k]) return "nofecha";
    if (est[d.k] === "firmado" && fec[d.k] > today()) return "futura";
    return "";
  };
  const anyProb = reqDocs(extra ? nArea : r.area).some(d => prob(d));
  const docDirty = d => est[d.k] !== (rec[d.est] === "firmado" ? "firmado" : "pendiente") || (est[d.k] === "firmado" && fec[d.k] !== (rec[d.fec] || "")) || enl[d.k] !== (rec[d.enl] || "");
  const dirty = idDirty || obs !== (rec.obs || "") || DOCS.some(docDirty);
  const reverts = DOCS.filter(d => rec[d.est] === "firmado" && est[d.k] === "pendiente");
  const doSave = async () => {
    const now = new Date().toISOString(); const h = [...rec.historial];
    const por = meRef.current || null;
    const body = { ...rec };
    DOCS.forEach(d => {
      const was = rec[d.est] === "firmado" ? "firmado" : "pendiente";
      if (est[d.k] !== was) h.push({ ts: now, accion: d.short + (est[d.k] === "firmado" ? ": marcado como firmado" : ": revertido a pendiente"), fecha: est[d.k] === "firmado" ? fec[d.k] : rec[d.fec], por });
      else if (est[d.k] === "firmado" && fec[d.k] !== rec[d.fec]) h.push({ ts: now, accion: d.short + ": fecha de firma corregida", fecha: fec[d.k], por });
      if (enl[d.k].trim() !== (rec[d.enl] || "")) h.push({ ts: now, accion: d.short + ": enlace actualizado", fecha: "", por });
      body[d.est] = est[d.k]; body[d.fec] = est[d.k] === "firmado" ? fec[d.k] : ""; body[d.enl] = enl[d.k].trim();
    });
    if (obs.trim() !== (rec.obs || "")) h.push({ ts: now, accion: "Observaciones actualizadas", fecha: "", por });
    if (idDirty) { h.push({ ts: now, accion: "Datos del colaborador corregidos", fecha: "", por }); EXTRA[id] = { id, nombre: nNombre, area: nArea, cargo: nCargo, agregado: true }; rebuildRoster(); }
    if (extra) Object.assign(body, { nombre: nNombre, area: nArea, cargo: nCargo });
    body.obs = obs.trim(); body.historial = h.slice(-HIST_MAX); body.actualizado = now;
    setSaving(true);
    const ok = await writeRec(id, body);
    setSaving(false);
    if (ok !== false) { say("Registro actualizado: " + (extra ? nNombre : r.nombre)); onClose(); }
  };
  const save = () => {
    if (anyProb || !idOk) return;
    if (reverts.length) setConfirm({ title: "¿Revertir firma registrada?", msg: html`<p style=${{margin:0}}>La firma de <b>${reverts.map(d => d.label).join(" y ")}</b> de <b>${r.nombre}</b> volverá a "Pendiente de firma". El cambio queda en el historial.</p>`, label: "Revertir y guardar", danger: true, onOk: doSave });
    else doSave();
  };
  const hist = rec.historial.slice().reverse();
  return html`<div className="scrim" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal" role="dialog" aria-modal="true" aria-labelledby="ficha-t">
      <div className="mhead"><div><h3 id="ficha-t">Registro individual</h3><span className="lock">${r.id} · ${extra ? "colaborador agregado: puedes corregir sus datos" : "los datos del colaborador vienen de la plantilla y no se editan aquí"}</span></div><button className="x" aria-label="Cerrar" onClick=${onClose}>×</button></div>
      <div className="mbody">
        ${extra && !readOnly ? html`<div className="fld" style=${{gap:"10px"}}>
          <label className="fld"><span>Nombre completo</span><input id="m-nombre" className="inp" value=${nombre} onChange=${e => setNombre(e.target.value)} />
            ${dupe ? html`<span className="err">Ya existe ${dupe.nombre} en ${dupe.area}.</span>` : nNombre.length < 5 ? html`<span className="err">Escribe el nombre completo.</span>` : null}</label>
          <div className="two">
            <label className="fld"><span>Área</span><input id="m-area" className="inp" list="dl-areas" value=${area} onChange=${e => setArea(e.target.value)} /></label>
            <label className="fld"><span>Cargo</span><input id="m-cargo" className="inp" list="dl-cargos-m" value=${cargo} onChange=${e => setCargo(e.target.value)} /></label>
          </div>
          <datalist id="dl-areas">${AREAS.map(a => html`<option key=${a} value=${a} />`)}</datalist>
          <datalist id="dl-cargos-m">${[...new Set(ROSTER.filter(x => x.area === nArea).map(x => x.cargo))].map(c => html`<option key=${c} value=${c} />`)}</datalist>
        </div>` : html`<dl className="ro"><dt>Nombre</dt><dd>${r.nombre}</dd><dt>Área</dt><dd>${r.area}</dd><dt>Cargo</dt><dd>${r.cargo}</dd></dl>`}
        ${!applies(extra ? nArea : r.area, DOC.d) ? html`<span className="hint">Dirección del abogado no aplica para ${extra ? nArea : r.area}.</span>` : null}
        ${reqDocs(extra ? nArea : r.area).map(d => { const p = prob(d); const f = est[d.k] === "firmado"; return html`<fieldset key=${d.k} className=${"docbox" + (f ? " ok" : "")}>
          <legend>${d.label}</legend>
          <div className="two">
            <div className="fld"><span>Estado</span><div className="toggle" role="group">
              <button className=${"p" + (!f ? " on" : "")} disabled=${readOnly} onClick=${() => changeEst(d, "pendiente")}>Pendiente de firma</button>
              <button className=${"f" + (f ? " on" : "")} disabled=${readOnly} onClick=${() => changeEst(d, "firmado")}>Firmado</button></div></div>
            <label className="fld"><span>Fecha de firma</span><input id=${"m-fecha-" + d.k} type="date" className="inp" value=${f ? fec[d.k] : ""} max=${today()} disabled=${readOnly || !f} onChange=${e => { const v = e.target.value; setFec(s => ({ ...s, [d.k]: v })); }} />
              ${p === "futura" ? html`<span className="err">La fecha no puede ser posterior a hoy.</span>` : p === "nofecha" ? html`<span className="err">Indica la fecha de firma.</span>` : null}</label>
          </div>
          <label className="fld"><span>Enlace al documento (opcional)</span><input id=${"m-enlace-" + d.k} type="url" className="inp" disabled=${readOnly} value=${enl[d.k]} onChange=${e => { const v = e.target.value; setEnl(s => ({ ...s, [d.k]: v })); }} placeholder="https://… (ubicación en el repositorio autorizado)" />
            ${p === "url" ? html`<span className="err">Escribe un enlace completo que empiece con https://</span>` : null}
            ${rec[d.enl] && enl[d.k] === rec[d.enl] && isUrl(rec[d.enl]) ? html`<a href=${rec[d.enl]} target="_blank" rel="noopener noreferrer" className="hint">Abrir enlace registrado ↗</a>` : null}</label>
        </fieldset>`; })}
        <span className="hint" style=${{marginTop:"-6px"}}>Guarda solo los enlaces. No pegues ni subas los documentos firmados aquí.</span>
        <label className="fld"><span>Observaciones</span><textarea id="m-obs" className="inp" rows="3" maxLength="2000" disabled=${readOnly} value=${obs} onChange=${e => setObs(e.target.value)} placeholder="Ej. firmó las formas en sesión presencial; Dirección del abogado pendiente de entregar original"></textarea></label>
        <div className="fld"><span>Historial de cambios</span>
          ${hist.length ? html`<ul className="hist">${hist.map((h, i) => html`<li key=${i} className=${h.accion.includes("firmado") ? "f" : ""}><time>${fmtTs(h.ts)}</time> · ${h.accion}${h.fecha ? " (" + fmtDate(h.fecha) + ")" : ""}${h.por ? html` · <span className="muted">${names[h.por] || "Usuario"}</span>` : null}</li>`)}</ul>` : html`<span className="hint">Sin cambios registrados.</span>`}</div>
        <p className="legal">Marcar como "Firmado" es un registro administrativo de confirmación; no es una firma electrónica ni prueba por sí solo la existencia del documento.</p>
      </div>
      <div className="mfoot">${extra && !readOnly ? html`<button className="btn" style=${{marginRight:"auto",color:"var(--red)"}} onClick=${() => onDelete(id)}>Eliminar colaborador</button>` : null}<button className="btn" onClick=${onClose}>${readOnly ? "Cerrar" : "Cancelar"}</button>
        ${readOnly ? null : html`<button className="btn pri" disabled=${!dirty || saving || anyProb || !idOk} onClick=${save}>${saving ? "Guardando…" : "Guardar cambios"}</button>`}</div>
    </div></div>`;
}

/* ---------- Agregar colaborador ---------- */
function AddPerson({ onClose, onSave, presetArea }){
  const [nombre, setNombre] = useState("");
  const [areaSel, setAreaSel] = useState(presetArea || "");
  const [areaNew, setAreaNew] = useState("");
  const [cargo, setCargo] = useState("");
  const [firmas, setFirmas] = useState({ c: false, d: false });
  const [fecha, setFecha] = useState(today());
  const [obs, setObs] = useState("");
  const [tried, setTried] = useState(false);
  const [saving, setSaving] = useState(false);
  useEffect(() => { const k = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  const nNombre = normName(nombre);
  const area = areaSel === "__otra" ? normName(areaNew) : areaSel;
  const nCargo = normName(cargo);
  const algun = reqDocs(area).some(d => firmas[d.k]);
  const dupe = nNombre ? ROSTER.find(x => norm(x.nombre) === norm(nNombre)) : null;
  const cargosArea = [...new Set(ROSTER.filter(x => x.area === area).map(x => x.cargo))].sort((a, b) => a.localeCompare(b, "es"));
  const errs = {
    nombre: !nNombre ? "Escribe el nombre completo." : nNombre.length < 5 ? "El nombre es demasiado corto." : dupe ? "Ya existe " + dupe.nombre + " en " + dupe.area + " (" + dupe.id + ")." : "",
    area: !area ? "Selecciona o escribe el área." : "",
    cargo: !nCargo ? "Escribe el cargo." : "",
    fecha: algun && (!fecha || fecha > today()) ? "Indica una fecha de firma válida (no posterior a hoy)." : ""
  };
  const valid = !Object.values(errs).some(Boolean);
  const submit = async e => {
    e.preventDefault(); setTried(true); if (!valid || saving) return;
    setSaving(true);
    await onSave({ nombre: nNombre, area, cargo: nCargo, firmas: Object.fromEntries(reqDocs(area).map(d => [d.k, !!firmas[d.k]])), fecha, obs: obs.trim() });
    setSaving(false);
  };
  const show = k => (tried || (k === "nombre" && dupe)) && errs[k] ? html`<span className="err">${errs[k]}</span>` : null;
  return html`<div className="scrim" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <form className="modal" role="dialog" aria-modal="true" aria-labelledby="add-t" onSubmit=${submit} noValidate>
      <div className="mhead"><div><h3 id="add-t">Agregar colaborador</h3><span className="lock">Para personas que no vienen en la plantilla original. Se identifican como "Agregado".</span></div><button type="button" className="x" aria-label="Cerrar" onClick=${onClose}>×</button></div>
      <div className="mbody">
        <label className="fld"><span>Nombre completo</span><input id="a-nombre" className="inp" autoFocus value=${nombre} onChange=${e => setNombre(e.target.value)} placeholder="NOMBRE(S) APELLIDO PATERNO APELLIDO MATERNO" />${show("nombre")}<span className="hint">Se guarda en mayúsculas, igual que la plantilla.</span></label>
        <div className="two">
          <label className="fld"><span>Área</span><select id="a-area" className="sel" value=${areaSel} onChange=${e => { setAreaSel(e.target.value); setCargo(""); }}>
            <option value="">Selecciona…</option>${AREAS.map(a => html`<option key=${a} value=${a}>${a}</option>`)}<option value="__otra">Otra área…</option></select>
            ${areaSel === "__otra" ? html`<input id="a-area-new" className="inp" style=${{marginTop:"6px"}} placeholder="Nombre de la nueva área" value=${areaNew} onChange=${e => setAreaNew(e.target.value)} />` : null}${show("area")}</label>
          <label className="fld"><span>Cargo</span><input id="a-cargo" className="inp" list="dl-cargos" value=${cargo} onChange=${e => setCargo(e.target.value)} placeholder=${cargosArea[0] || "Ej. PARALEGAL"} />
            <datalist id="dl-cargos">${cargosArea.map(c => html`<option key=${c} value=${c} />`)}</datalist>${show("cargo")}</label>
        </div>
        <div className="two">
          <div className="fld"><span>Documentos ya firmados</span>
            ${reqDocs(area).map(d => html`<label key=${d.k} className="chk"><input type="checkbox" id=${"a-f-" + d.k} checked=${firmas[d.k]} onChange=${e => { const v = e.target.checked; setFirmas(s => ({ ...s, [d.k]: v })); }} /> ${d.label}</label>`)}
            <span className="hint">Déjalos sin marcar si aún no firma.</span></div>
          <label className="fld"><span>Fecha de firma</span><input id="a-fecha" type="date" className="inp" max=${today()} disabled=${!algun} value=${algun ? fecha : ""} onChange=${e => setFecha(e.target.value)} />${show("fecha")}</label>
        </div>
        <label className="fld"><span>Observaciones (opcional)</span><textarea id="a-obs" className="inp" rows="2" maxLength="2000" value=${obs} onChange=${e => setObs(e.target.value)} placeholder="Ej. ingreso reciente, no estaba en la lista original"></textarea></label>
      </div>
      <div className="mfoot"><button type="button" className="btn" onClick=${onClose}>Cancelar</button><button type="submit" className="btn pri" disabled=${saving}>${saving ? "Guardando…" : "Agregar colaborador"}</button></div>
    </form></div>`;
}

/* ---------- Exportar / respaldo ---------- */
function Respaldo({ recs, mode, readOnly, exportCsv, exportAreas, exportJson, stat, writeRec, pushList, say, setConfirm, meRef, cfg, setCfg, sheetErr, reload }){
  const [url, setUrl] = useState(cfg.url || "");
  const [tok, setTok] = useState(cfg.token || "");
  const [testing, setTesting] = useState(false);
  const [testMsg, setTestMsg] = useState("");
  const [plan, setPlan] = useState(null);
  const [policy, setPolicy] = useState("recientes");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(null);
  const onFile = e => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; setErr(""); setPlan(null);
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      let data; try { data = JSON.parse(fr.result); } catch (x) { setErr("El archivo no es un JSON válido."); return; }
      if (!data || data.app !== APP || !Array.isArray(data.registros)) { setErr("Este archivo no es un respaldo de Control de Consentimientos."); return; }
      const seen = new Set(); const items = []; let ign = 0, dup = 0;
      data.registros.forEach(x => {
        if (!x || !okRecord(x.id, x)) { ign++; return; }
        const r = BY_ID[x.id];
        if (r && norm(r.nombre) !== norm(x.nombre)) { ign++; return; }
        if (!r && ROSTER.some(o => norm(o.nombre) === norm(x.nombre))) { ign++; return; }
        if (seen.has(x.id)) { dup++; return; }
        seen.add(x.id); items.push({ id: x.id, body: clean(x) });
      });
      setPlan({ file: file.name, exportado: data.exportado, items, ign, dup });
    };
    fr.onerror = () => setErr("No se pudo leer el archivo.");
    fr.readAsText(file);
  };
  const changes = useMemo(() => {
    if (!plan) return [];
    return plan.items.filter(({ id, body }) => {
      if (isExtraId(id) && !recs[id]) return true;
      const cur = recs[id] || EMPTY;
      const same = cur.obs === body.obs && DOCS.every(d => cur[d.est] === body[d.est] && cur[d.fec] === body[d.fec] && cur[d.enl] === body[d.enl]);
      if (same) return false;
      if (policy === "recientes") return (body.actualizado || "") > (cur.actualizado || "");
      return true;
    });
  }, [plan, recs, policy]);
  const apply = async () => {
    setBusy({ done: 0, total: changes.length });
    const now = new Date().toISOString();
    const list = changes.map(({ id, body }) => ({ id, body: { ...body, actualizado: now, historial: [...body.historial, { ts: now, accion: "Restaurado desde respaldo", fecha: body.fecha, por: meRef.current || null }].slice(-HIST_MAX) } }));
    addExtras(Object.fromEntries(list.map(it => [it.id, it.body])));
    const fails = await pushList(list, "importacion");
    setBusy(null); setPlan(null);
    if (mode !== "sheets") say(fails ? "Importación con " + fails + " errores; revisa los registros." : "Respaldo importado: " + changes.length + " registros actualizados", !!fails);
  };
  const firmadosIn = changes.reduce((n, c) => n + DOCS.filter(d => isSigned(c.body, d) && !isSigned(recs[c.id], d)).length, 0);
  const reverts = changes.reduce((n, c) => n + DOCS.filter(d => !isSigned(c.body, d) && isSigned(recs[c.id], d)).length, 0);
  return html`
    <div className="sec-h"><div><h2>Exportar y respaldo</h2><p>Los archivos se generan con los datos vigentes al momento de exportar.</p></div></div>
    <section className="panel" style=${{marginBottom:"14px"}}>
      <h3>Conexión con Google Sheets ${mode === "sheets" ? html`<span className="pill f" style=${{marginLeft:"8px"}}>Conectado</span>` : cfg.url ? html`<span className="pill p" style=${{marginLeft:"8px"}}>Sin conexión</span>` : null}</h3>
      <p>Con la URL de la aplicación web de Apps Script, cada firma y cada cambio se guardan en la hoja "Consentimientos" y quedan en la "Bitacora". Todas las personas que usen esta misma URL ven los mismos datos.</p>
      <div className="two">
        <label className="fld"><span>URL de la aplicación web (/exec)</span><input id="cfg-url" className="inp" type="url" placeholder="https://script.google.com/macros/s/…/exec" value=${url} onChange=${e => setUrl(e.target.value)} /></label>
        <label className="fld"><span>Clave TOKEN (si la configuraste)</span><input id="cfg-tok" className="inp" type="password" autoComplete="off" value=${tok} onChange=${e => setTok(e.target.value)} /></label>
      </div>
      ${testMsg ? html`<span className=${testMsg.startsWith("✓") ? "hint" : "err"}>${testMsg}</span>` : null}
      <div style=${{display:"flex",gap:"8px",flexWrap:"wrap"}}>
        <button className="btn pri" disabled=${testing || !/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url.trim())} onClick=${async () => {
          setTesting(true); setTestMsg("");
          const c = { url: url.trim(), token: tok };
          try { const j = await sheetsGet(c); setTestMsg("✓ Conectado. La hoja tiene " + (j.records || []).length + " registros."); storeCfg(c); setCfg(c); }
          catch (e) { setTestMsg("No se pudo conectar: " + (e && e.message || e) + ". Revisa que la implementación tenga acceso para \"Cualquier usuario\"."); }
          setTesting(false);
        }}>${testing ? "Probando…" : "Probar y conectar"}</button>
        ${mode === "sheets" ? html`
          <button className="btn" onClick=${reload}>Actualizar desde la hoja</button>
          <button className="btn" disabled=${readOnly} onClick=${() => setConfirm({ title: "¿Enviar todo a la hoja?", msg: html`<p style=${{margin:0}}>Se envían los <b>${stat.total}</b> colaboradores con su estado actual. Útil para llenar la hoja por primera vez. No sobrescribe cambios más recientes que ya estén en la hoja.</p>`, label: "Enviar " + stat.total + " registros", onOk: () => pushList(ROSTER.map(r => ({ id: r.id, body: recs[r.id] || { ...EMPTY, actualizado: "2000-01-01T00:00:00.000Z" } })), "carga-inicial") })}>Enviar todos los registros</button>` : null}
        ${cfg.url ? html`<button className="btn" onClick=${() => { const c = { url: "", token: "" }; storeCfg(c); setCfg(c); setUrl(""); setTok(""); setTestMsg(""); }}>Desconectar</button>` : null}
      </div>
    </section>
    <div className="cols">
      <section className="panel"><h3>Reportes CSV</h3><p>Se abren en Excel o Google Sheets. Incluyen ID, nombre, área, cargo, y estado, fecha y enlace de cada documento.</p>
        <div className="btnlist">
          <button className="btn" onClick=${() => exportCsv("todos")}>Todos los registros <small className="num">${stat.total}</small></button>
          <button className="btn" onClick=${() => exportCsv("pendientes")}>Con alguna firma pendiente <small className="num">${stat.pend}</small></button>
          <button className="btn" onClick=${() => exportCsv("completos")}>Con firmas completas <small className="num">${stat.comp}</small></button>
          <button className="btn" onClick=${() => exportCsv("falta_c")}>Falta Firma de las formas <small className="num">${stat.cReq - stat.c}</small></button>
          <button className="btn" onClick=${() => exportCsv("falta_d")}>Falta Dirección del abogado <small className="num">${stat.dReq - stat.d}</small></button>
          <button className="btn" onClick=${exportAreas}>Reporte consolidado por área <small className="num">${AREAS.length} áreas</small></button>
        </div></section>
      <section className="panel"><h3>Respaldo JSON</h3>
        <p>${mode === "sheets" ? "Los registros se guardan en Google Sheets. Descarga un respaldo periódico como copia adicional." : mode === "db" ? "Los registros se guardan en el almacenamiento compartido de esta herramienta y se conservan al cerrarla. Aun así, descarga un respaldo periódico como copia de seguridad." : "Los cambios no se comparten fuera de este navegador. Descarga un respaldo al terminar cada sesión de captura."}</p>
        <div className="btnlist"><button className="btn pri" onClick=${exportJson}>Descargar respaldo JSON <small className="num">${stat.total} registros</small></button></div>
        <div className="fld"><span>Importar respaldo</span>
          <input id="imp-file" type="file" accept=".json,application/json" className="inp" disabled=${readOnly || !!busy} onChange=${onFile} />
          <span className="hint">Nunca se eliminan registros: solo se actualizan colaboradores que coinciden por ID y nombre. Verás un resumen antes de aplicar.</span>
          ${err ? html`<span className="err">${err}</span>` : null}</div>
        ${plan ? html`<div className="fld">
          <span>Resumen de ${plan.file}</span>
          <div className="imp-sum num">
            <span>Exportado</span><b>${fmtTs(plan.exportado) || "—"}</b>
            <span>Coincidencias</span><b>${plan.items.length}</b>
            <span>Colaboradores agregados nuevos</span><b>${changes.filter(c => isExtraId(c.id) && !recs[c.id]).length}</b>
            <span>Cambios a aplicar</span><b>${changes.length}</b>
            <span>Firmas que se registran</span><b>${firmadosIn}</b>
            <span>Firmas que se revierten</span><b style=${reverts ? {color:"var(--red)"} : null}>${reverts}</b>
            <span>Ignorados / duplicados</span><b>${plan.ign} / ${plan.dup}</b>
          </div>
          <div className="seg" style=${{marginTop:"6px"}}>
            <button aria-pressed=${policy === "recientes"} onClick=${() => setPolicy("recientes")}>Solo si el respaldo es más reciente</button>
            <button aria-pressed=${policy === "todo"} onClick=${() => setPolicy("todo")}>Reemplazar con el respaldo</button></div>
          <div style=${{display:"flex",gap:"8px",marginTop:"8px",flexWrap:"wrap"}}>
            <button className="btn" onClick=${() => setPlan(null)} disabled=${!!busy}>Cancelar</button>
            <button className=${"btn " + (reverts ? "danger" : "ok")} disabled=${!changes.length || !!busy} onClick=${() => setConfirm({ title: "¿Aplicar respaldo?", msg: html`<p style=${{margin:0}}>Se actualizarán <b>${changes.length}</b> registros${reverts ? html`, incluidas <b>${reverts}</b> firmas que volverán a pendiente` : ""}. Los demás colaboradores no cambian.</p>`, label: "Aplicar " + changes.length + " cambios", danger: !!reverts, onOk: apply })}>
              ${busy ? "Aplicando " + busy.done + "/" + busy.total + "…" : "Aplicar " + changes.length + " cambios"}</button>
          </div></div>` : null}
      </section>
    </div>`;
}

function Confirm({ title, msg, label, danger, onOk, onClose }){
  useEffect(() => { const k = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  return html`<div className="scrim" style=${{zIndex:55}} onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal sm" role="alertdialog" aria-modal="true" aria-labelledby="cf-t">
      <div className="mhead"><h3 id="cf-t">${title}</h3></div>
      <div className="mbody">${msg}</div>
      <div className="mfoot"><button className="btn" onClick=${onClose}>Cancelar</button><button className=${"btn " + (danger ? "danger" : "pri")} autoFocus onClick=${() => { onClose(); onOk(); }}>${label}</button></div>
    </div></div>`;
}

function CopyBox({ title, text, note, onClose }){
  const ref = useRef(null);
  useEffect(() => { if (ref.current) { const s = window.getSelection(); const rg = document.createRange(); rg.selectNodeContents(ref.current); s.removeAllRanges(); s.addRange(rg); } }, []);
  return html`<div className="scrim" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal" role="dialog" aria-modal="true"><div className="mhead"><h3>${title}</h3><button className="x" aria-label="Cerrar" onClick=${onClose}>×</button></div>
    <div className="mbody"><p className="hint" style=${{margin:0}}>${note}</p><pre className="copybox" ref=${ref}>${text}</pre></div>
    <div className="mfoot"><button className="btn pri" onClick=${onClose}>Listo</button></div></div></div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
