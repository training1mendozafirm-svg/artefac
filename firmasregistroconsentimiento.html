<title>Control de Firmas TMLF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: navy masthead with a ledger of KPIs, tabbed workspace below (panel / colaboradores / pendientes / respaldo). */
:root{
  --navy:#14284b; --navy-2:#1d3864; --ink:#16223a; --muted:#5b6880; --line:#dbe1ea; --line-2:#c9d2df;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f8f9fb; --chip:#eef2f8;
  --green:#1f8a5b; --green-soft:#e3f3ea; --green-ink:#146a44;
  --amber:#a8640f; --amber-soft:#fbf0dd; --red:#b23a3a; --red-soft:#f8e6e6;
  --on-navy:#ffffff; --on-navy-muted:#b9c5da; --focus:#3d7be0; --tagfg:#1d3864;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0e1c35; --navy-2:#16284a; --ink:#e6ebf3; --muted:#9aa7bd; --line:#2a3854; --line-2:#36466a;
  --bg:#0b1426; --surface:#121f38; --surface-2:#172642; --chip:#1c2c4b;
  --green:#3fbf86; --green-soft:#143829; --green-ink:#7ddcb0;
  --amber:#e0a14a; --amber-soft:#3a2b14; --red:#e07a7a; --red-soft:#3d1d22;
  --on-navy:#ffffff; --on-navy-muted:#9fb0cc; --focus:#6aa0f5; --tagfg:#b9c9ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0e1c35; --navy-2:#16284a; --ink:#e6ebf3; --muted:#9aa7bd; --line:#2a3854; --line-2:#36466a;
  --bg:#0b1426; --surface:#121f38; --surface-2:#172642; --chip:#1c2c4b;
  --green:#3fbf86; --green-soft:#143829; --green-ink:#7ddcb0;
  --amber:#e0a14a; --amber-soft:#3a2b14; --red:#e07a7a; --red-soft:#3d1d22;
  --on-navy:#ffffff; --on-navy-muted:#9fb0cc; --focus:#6aa0f5; --tagfg:#b9c9ea; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* Masthead */
.mast{background:var(--navy);color:var(--on-navy);padding-block:22px 0}
.mast-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.firm{font-size:11.5px;letter-spacing:.18em;font-weight:600;color:var(--on-navy-muted)}
.mast h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.2vw,30px);margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
.store{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--on-navy)}
.dot{width:8px;height:8px;border-radius:50%;background:#7a869c;flex:none}
.dot.ok{background:#4fd39a}.dot.warn{background:#f0b45a}.dot.bad{background:#ff8a8a}.dot.busy{background:#8fb6ff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:20px;border-top:1px solid rgba(255,255,255,.14)}
.kpi{padding:14px 18px 14px 0;border-right:1px solid rgba(255,255,255,.14)}
.kpi+.kpi{padding-left:18px}.kpi:last-child{border-right:0}
.kpi .lbl{font-size:11px;letter-spacing:.12em;font-weight:600;color:var(--on-navy-muted)}
.kpi .val{font-family:var(--display);font-size:clamp(26px,3.6vw,36px);font-weight:700;line-height:1.1;margin-top:4px}
.kpi.g .val{color:#6fe0ac}
.kpi .sub{font-size:11.5px;color:var(--on-navy-muted);margin-top:2px}
.docs-sub{font-size:13px;color:var(--on-navy-muted);margin-top:4px}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
@media (max-width:600px){.prog{grid-template-columns:1fr}}
.drow{display:flex;flex-direction:column;gap:4px}
.drow.na .drow-l span:last-child{font-style:italic}
.doctag{align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
.acard.empty-area{cursor:default;border-style:dashed;background:var(--surface-2)}
.acard.empty-area:hover{transform:none;border-color:var(--line)}
.na-cell{font-size:12px;color:var(--muted);font-style:italic}
.drow-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.dcell{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.dfecha{font-size:11.5px;color:var(--muted);padding-left:4px}
tr.partial td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
fieldset.docbox{border:1px solid var(--line);border-radius:8px;padding:10px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset.docbox.ok{border-color:var(--green)}
fieldset.docbox legend{font-weight:700;font-size:13px;padding:0 6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--green)}
.miss{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.miss .pill{font-size:11px;padding:2px 8px}
.regs{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi,.kpi+.kpi{padding:12px 14px 12px 0;border-right:0}.kpi:nth-child(even){padding-left:14px;border-left:1px solid rgba(255,255,255,.14)}.kpi:nth-child(n+3){border-top:1px solid rgba(255,255,255,.14)}.kpi:last-child{grid-column:1/-1;border-left:0;padding-left:0}}
.prog{padding-block:4px 18px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--on-navy-muted);margin-bottom:6px;gap:12px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:#4fd39a;border-radius:999px;transition:width .4s ease}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:var(--on-navy-muted);padding:11px 16px;font-weight:600;font-size:13.5px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--on-navy)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab .cnt{font-size:11.5px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px}
.tab[aria-selected="true"] .cnt{background:var(--chip)}

main{padding-block:22px 48px}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--muted);margin-bottom:18px}
.notice b{color:var(--ink)}
.notice.warn{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.notice.bad{background:var(--red-soft);border-color:transparent;color:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sec-h h2{font-family:var(--display);font-size:21px;margin:0;font-weight:700}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* Area cards */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s, transform .15s}
.acard:hover{border-color:var(--navy-2);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.acard{transition:none}.acard:hover{transform:none}}
.acard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.acard .nm{font-weight:700;letter-spacing:.04em;font-size:13px}
.acard .pc{font-family:var(--display);font-weight:700;font-size:22px}
.acard.done .pc{color:var(--green)}
.mbar{height:6px;background:var(--chip);border-radius:999px;overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s}
.acard .meta{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.acard .meta b{color:var(--ink);font-weight:600}
.acard .go{font-size:12px;color:var(--muted)}

/* Controls */
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr)) auto auto auto;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
@media (max-width:480px){.filters{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--muted);text-transform:uppercase}
.inp,.sel,textarea.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:36px}
.sel{appearance:auto}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:#fff}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--navy-2)}
.btn.pri{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
.resline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 2px 10px}
.chipf{display:inline-flex;gap:6px;align-items:center;background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;margin-left:6px}

/* Table */
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1040px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th .sort{background:none;border:0;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:flex;gap:5px;align-items:center;width:100%}
th .plain{display:block;padding:10px 12px}
th .sort:hover{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tr.signed td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.nmbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;color:var(--ink)}
.nmbtn:hover{text-decoration:underline}
.newtag{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--tagfg);padding:1px 6px;border-radius:4px;margin-left:4px}
.idt{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:1px}
.area-tag{font-size:11.5px;font-weight:600;letter-spacing:.04em;background:var(--chip);padding:2px 8px;border-radius:4px;white-space:nowrap}
.cargo{font-size:12.5px;color:var(--muted);max-width:230px}
.obs{font-size:12.5px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2);gap:2px}
.toggle button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.toggle button.on.p{background:var(--amber-soft);color:var(--amber);font-weight:600}
.toggle button.on.f{background:var(--green);color:#fff;font-weight:600}
.toggle button:disabled{cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.f{background:var(--green-soft);color:var(--green-ink)}
.pill.p{background:var(--amber-soft);color:var(--amber)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}

/* Pendientes */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pgroup h3{margin:0;padding:10px 14px;font-size:13px;letter-spacing:.05em;display:flex;justify-content:space-between;background:var(--surface-2);border-bottom:1px solid var(--line)}
.pgroup ul{list-style:none;margin:0;padding:4px 0}
.pgroup li{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 14px}
.pgroup li .who{min-width:0}
.pgroup li .who b{display:block;font-weight:600;font-size:13px}
.pgroup li .who span{font-size:12px;color:var(--muted)}
.alldone{background:var(--green-soft);color:var(--green-ink);border-radius:var(--r);padding:28px;text-align:center;font-weight:600}

/* Export panel */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:15px}
.panel p{margin:0;color:var(--muted);font-size:13px;max-width:65ch}
.btnlist{display:flex;flex-direction:column;gap:8px}
.btnlist .btn{justify-content:space-between}
.btnlist .btn small{color:var(--muted);font-weight:400}
.btn.pri small{color:#d5def0}
.imp-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px;background:var(--surface-2);border-radius:6px;padding:10px 12px}
.imp-sum b{font-family:var(--mono)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,15,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:10px;width:min(620px,100%);max-height:calc(100% - 16px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.sm{width:min(440px,100%)}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mhead h3{margin:0;font-family:var(--display);font-size:19px}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:var(--surface-2)}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.ro{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13.5px;background:var(--surface-2);border-radius:6px;padding:12px 14px}
.ro dt{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding-top:2px}
.ro dd{margin:0;font-weight:500}
.lock{font-size:11.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--red)}
.hist{list-style:none;margin:0;padding:0;font-size:12.5px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hist li{padding-left:12px;position:relative}
.hist li::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.hist li.f::before{background:var(--green)}
.hist time{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.legal{font-size:12px;color:var(--muted);border-top:1px dashed var(--line-2);padding-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--red);color:#fff}
pre.copybox{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:320px;overflow:auto;margin:0}
.foot{font-size:12px;color:var(--muted);margin-top:28px;padding-top:14px;border-top:1px solid var(--line);max-width:80ch}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>

(function(){

/* ---------- Base de colaboradores (archivo original, sin cambios) ---------- */
const BASE = ROSTER_RAW.map(r => ({ id: r[0], area: r[1], cargo: r[2], nombre: r[3] }));
const BASE_IDS = new Set(BASE.map(r => r.id));
/* Colaboradores agregados después (IDs que empiezan con N); se guardan junto con su registro */
let ROSTER = BASE.slice();
let BY_ID = Object.fromEntries(ROSTER.map(r => [r.id, r]));
/* Áreas que aún no tienen personas registradas (aparecen vacías hasta que se agreguen) */
const EMPTY_AREAS = ["LSU"];
let AREAS = [...new Set([...ROSTER.map(r => r.area), ...EMPTY_AREAS])];
const EXTRA = {};
const isExtraId = id => /^N[0-9A-Z]{4,14}$/.test(String(id || ""));
const okRecord = (id, x) => BASE_IDS.has(id) || (isExtraId(id) && !!x && typeof x.nombre === "string" && !!x.nombre.trim() && !!x.area);
function rebuildRoster(){
  const extras = Object.values(EXTRA).sort((a, b) => a.id.localeCompare(b.id));
  ROSTER = BASE.concat(extras);
  BY_ID = Object.fromEntries(ROSTER.map(r => [r.id, r]));
  AREAS = [...new Set([...ROSTER.map(r => r.area), ...EMPTY_AREAS])];
}
function addExtras(map){
  let ch = false;
  for (const id in map) {
    const b = map[id]; if (!isExtraId(id) || !b || !b.nombre) continue;
    const e = EXTRA[id];
    if (!e || e.nombre !== b.nombre || e.area !== b.area || e.cargo !== b.cargo) { EXTRA[id] = { id, nombre: b.nombre, area: b.area, cargo: b.cargo || "", agregado: true }; ch = true; }
  }
  if (ch) rebuildRoster();
}
function resetExtras(map){ for (const k in EXTRA) delete EXTRA[k]; rebuildRoster(); addExtras(map); }
function removeExtra(id){ delete EXTRA[id]; rebuildRoster(); }
const newExtraId = () => "N" + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase();
const normName = s => (s || "").toUpperCase().replace(/\s+/g, " ").trim();

const SHEETS_URL_DEFAULT = "https://script.google.com/macros/s/AKfycbwmWDK7YK50l8bhaKaqjuYrus5fgxgYbjsuCXlPkM4RwYP9kcM6br0wHhMWl0hJUSjMfQ/exec";

}

async function sheetsGet(cfg){
  const u = cfg.url + (cfg.url.includes("?") ? "&" : "?") + "action=list&token=" + encodeURIComponent(cfg.token || "") + "&_=" + Date.now();
  const r = await fetch(u, { method: "GET", redirect: "follow" });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === "unauthorized" ? "Clave (TOKEN) incorrecta" : (j.error || "Respuesta inválida"));
  return j;
}
async function sheetsUpsert(cfg, records, origen){
  const r = await fetch(cfg.url, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "upsert", token: cfg.token || "", origen: origen || "web", records }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === "unauthorized" ? "Clave (TOKEN) incorrecta" : (j.error || "Respuesta inválida"));
  return j;
}
async function sheetsDelete(cfg, id){
  const r = await fetch(cfg.url, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", token: cfg.token || "", id }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error === "unauthorized" ? "Clave (TOKEN) incorrecta" : (j.error || "Respuesta inválida"));
  return j;
}
const withRoster = (id, body) => { const r = BY_ID[id] || body; return { ...body, id, nombre: r.nombre, area: r.area, cargo: r.cargo }; };
function readLocalCache(){
  try { const o = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); const out = {}; for (const k in o) if (okRecord(k, o[k])) out[k] = clean(o[k]); return out; } catch (e) { return {}; }
}

/* ---------- Utilidades ---------- */
const pad = n => String(n).padStart(2, "0");

const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return d + "/" + m + "/" + y; };
const fmtTs = s => { if (!s) return ""; const d = new Date(s); if (isNaN(d)) return s; return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const pct = (a, b) => b ? Math.round((a / b) * 1000) / 10 : 0;
const fmtPct = n => (Number.isInteger(n) ? n : n.toFixed(1)) + "%";
const isUrl = s => !s || /^https?:\/\/\S+$/i.test(s.trim());
const clean = body => ({
  estado: body.estado === "firmado" ? "firmado" : "pendiente",
  fecha: typeof body.fecha === "string" ? body.fecha.slice(0, 10) : "",
  obs: typeof body.obs === "string" ? body.obs.slice(0, 2000) : "",
  enlace: typeof body.enlace === "string" ? body.enlace.slice(0, 1000) : "",
  historial: Array.isArray(body.historial) ? body.historial.slice(-HIST_MAX).map(h => ({ ts: String(h.ts || ""), accion: String(h.accion || ""), fecha: String(h.fecha || ""), por: h.por ? String(h.por) : null })) : [],
  actualizado: typeof body.actualizado === "string" ? body.actualizado : "",
  dir_estado: body.dir_estado === "firmado" ? "firmado" : "pendiente",
  dir_fecha: typeof body.dir_fecha === "string" ? body.dir_fecha.slice(0, 10) : "",
  dir_enlace: typeof body.dir_enlace === "string" ? body.dir_enlace.slice(0, 1000) : "",
  nombre: typeof body.nombre === "string" ? body.nombre.slice(0, 200) : "",
  area: typeof body.area === "string" ? body.area.slice(0, 120) : "",
  cargo: typeof body.cargo === "string" ? body.cargo.slice(0, 200) : ""
});
const EMPTY = { estado: "pendiente", fecha: "", enlace: "", dir_estado: "pendiente", dir_fecha: "", dir_enlace: "", obs: "", historial: [], actualizado: "" };
/* Documentos que firma cada colaborador */
const DOCS = [
  { k: "c", label: "Firma de las formas", short: "Firma de las formas", est: "estado", fec: "fecha", enl: "enlace" },
  { k: "d", label: "Dirección del abogado", short: "Dirección del abogado", est: "dir_estado", fec: "dir_fecha", enl: "dir_enlace" }
];
const DOC = Object.fromEntries(DOCS.map(d => [d.k, d]));
const isSigned = (c, d) => (c || EMPTY)[d.est] === "firmado";
/* Dirección del abogado: aplica para TODAS las áreas.
   Para limitarla a ciertas áreas, cambia DIR_TODAS a false y lista las áreas en DIR_AREAS. */
const DIR_TODAS = true;
const DIR_AREAS = ["COMPLIANCE", "BACK OFFICE", "LITIGATION", "CALL BACKS", "CASE REVIEW", "LSU", "RFE"];
/* Firma de las formas: NO aplica para estas áreas */
const FORMAS_EXCLUIDAS = ["CUSTOMER SERVICE", "CALL BACKS", "COLLECTIONS", "DVS", "PMO", "WAES"];
const applies = (area, d) => d.k === "c" ? !FORMAS_EXCLUIDAS.includes(area) : (DIR_TODAS || DIR_AREAS.includes(area));
const reqDocs = area => DOCS.filter(d => applies(area, d));
const nSigned = (c, area) => reqDocs(area).filter(d => isSigned(c, d)).length;
const isComplete = (c, area) => nSigned(c, area) === reqDocs(area).length;

function csvCell(v){ const s = v == null ? "" : String(v); return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCsv(rows){ return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { return false; }
}

/* ---------- App ---------- */
function App(){
  const [recs, setRecs] = useState({});           // id -> consent body
  const [mode, setMode] = useState("loading");     // loading | db | local | memory
  const [readOnly, setReadOnly] = useState(false);
  const [pending, setPending] = useState(0);
  const [lastSave, setLastSave] = useState(null);
  const [tab, setTab] = useState("panel");
  const [q, setQ] = useState("");
  const [fArea, setFArea] = useState("");

  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);

  const [names, setNames] = useState({});
  const [cfg, setCfg] = useState(loadCfg);
  const [sheetErr, setSheetErr] = useState("");
  const [reloadKey, setReloadKey] = useState(0);
  const [adding, setAdding] = useState(false);
  const dbRef = useRef(null), userRef = useRef(null), dlRef = useRef(null), meRef = useRef(null);
  const chains = useRef({});
  const localRef = useRef({});
  const recsRef = useRef(recs); recsRef.current = recs;

  addExtras(recs);
  const say = useCallback((msg, bad) => { setToast({ msg, bad, k: Date.now() }); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), toast.bad ? 6000 : 3200); return () => clearTimeout(t); }, [toast]);

  /* Persistencia: db compartida → localStorage → memoria */
  useEffect(() => {
    let unsub = null, cancelled = false;
    const loadLocal = () => {
      try {
        const raw = localStorage.getItem(LS_KEY);
        const obj = raw ? JSON.parse(raw) : {};
        const out = {}; for (const k in obj) if (okRecord(k, obj[k])) out[k] = clean(obj[k]);
        resetExtras(out);
        localRef.current = { ...out }; setRecs(out); setMode("local");
      } catch (e) { setMode("memory"); }
    };
    (async () => {
      if (cfg.url) {
        try {
          const j = await sheetsGet(cfg);
          if (cancelled) return;
          const out = {};
          (j.records || []).forEach(x => { if (okRecord(x.id, x)) out[x.id] = clean(x); });
          resetExtras(out);
          setRecs(out); setMode("sheets"); setSheetErr(""); setLastSave(null);
          // Registros capturados en este navegador más recientes que la hoja
          const cache = readLocalCache();
          const newer = Object.keys(cache).filter(id => (cache[id].actualizado || "") > ((out[id] || EMPTY).actualizado || ""));
          if (newer.length) setConfirm({
            title: "Registros de este navegador sin subir",
            msg: html`<p style=${{margin:0}}>Hay <b>${newer.length}</b> registros guardados en este navegador que son más recientes que los de la hoja (${newer.filter(id => cache[id].estado === "firmado").length} con firma). ¿Quieres enviarlos a Google Sheets?</p>`,
            label: "Enviar " + newer.length + " registros",
            onOk: () => { addExtras(cache); pushRef.current(newer.map(id => ({ id, body: cache[id] })), "navegador"); }
          });
          return;
        } catch (e) {
          if (cancelled) return;
          setSheetErr(String(e && e.message || e));
          loadLocal(); return;
        }
      }
      const c = window.claude;
      if (!c || typeof c.use !== "function") { loadLocal(); return; }
      let db = null;
      try { db = await c.use("db"); } catch (e) { db = null; }
      if (cancelled) return;
      if (!db) { loadLocal(); return; }
      dbRef.current = db;
      try {
        const u = await c.use("user"); userRef.current = u;
        if (u) {
          meRef.current = await u.id();
          const can = await u.can("data.write");
          if (can === false) setReadOnly(true);
        }
      } catch (e) {}

        const out = {};

        resetExtras(out);
        setRecs(out); setMode("db");
      }, err => { say("Se perdió la conexión con el almacenamiento compartido. Recarga la página.", true); });

  }, [cfg.url, cfg.token, reloadKey]);

  useEffect(() => {

  const cfgRef = useRef(cfg); cfgRef.current = cfg;

      setPending(p => p + 1);
      const prev = chains.current[id] || Promise.resolve();
      const run = prev.then(() => sheetsUpsert(cfgRef.current, [withRoster(id, body)], "web"))

          if (j.skipped && j.skipped.length) { say("Alguien más actualizó a " + BY_ID[id].nombre + " antes. Se recargaron los datos de la hoja.", true); setReloadKey(k => k + 1); return false; }
