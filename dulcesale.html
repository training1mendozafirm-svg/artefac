  $('#nav').innerHTML = NAV.map(([k, ic, l]) => `<button class="${UI.view === k ? 'on' : ''}" data-act="nav" data-v="${k}"><span class="ic">${ic}</span>${l}${k === 'inventario' && nAl && state.config.alerts.showBanner ? `<span class="badge-n">${nAl}</span>` : ''}</button>`).join('');
  const TB = [['caja', '🛒', 'Caja'], ['historial', '🧾', 'Ventas'], ['productos', '🍬', 'Productos'], ['inventario', '📦', 'Inventario']];
  $('#tabbar').innerHTML = TB.map(([k, ic, l]) => `<button class="${UI.view === k ? 'on' : ''}" data-act="nav" data-v="${k}"><span class="ic">${ic}</span>${l}${k === 'inventario' && nAl && state.config.alerts.showBanner ? `<span class="badge-n">${nAl}</span>` : ''}</button>`).join('') + `<button data-act="openMenu"><span class="ic">☰</span>Más</button>`;
  const chip = $('#cajaChip'); chip.className = 'pill hide-s ' + (ses ? 'ok' : 'warn'); chip.textContent = ses ? '🔓 Caja abierta' : '🔒 Caja cerrada'; chip.dataset.act = 'nav'; chip.dataset.v = 'corte'; chip.style.cursor = 'pointer';
  applyTheme(); updateSaveBadge(); updateCloudBadge(); renderBanners(); tick();
}
function renderBanners() {
  const out = [];
  if (!Store.persistent()) out.push(`<div class="banner bad"><span>⚠ <b>Los datos NO se están guardando.</b> Este entorno no permite almacenamiento. Descarga el archivo HTML y ábrelo en tu navegador para conservar la información; mientras tanto exporta respaldos JSON.</span><span class="sp"></span><button class="btn btn-danger sm" data-act="exportBackup">Descargar respaldo</button></div>`);
  else if (saveError) out.push(`<div class="banner bad"><span>⚠ No se pudo guardar el último cambio (${esc(saveError.message || 'error')}). Descarga un respaldo ahora.</span><span class="sp"></span><button class="btn btn-danger sm" data-act="exportBackup">Descargar respaldo</button></div>`);
  if (Cloud.state === 'behind') out.push(`<div class="banner warn"><span>☁ Hay datos más recientes en Google Sheets (de otro dispositivo).</span><span class="sp"></span><button class="btn btn-yellow sm" data-act="cloudPull">Traer datos</button></div>`);
  if (Cloud.enabled() && Pay.mode() === 'prueba') out.push(`<div class="banner warn"><span>💳 Pagos en <b>MODO PRUEBA</b>: no se cobra dinero real. Las ventas de prueba quedan marcadas “PRUEBA”.</span></div>`);
  { const nPend = state.payOrders.filter(o => o.status === 'pending').length, nProb = state.payOrders.filter(o => o.status === 'approved' && !o.saleId).length, nRef = state.sales.filter(s => s.mp && s.mp.status === 'refunded' && s.status === 'completada').length;
    if (nProb) out.push(`<div class="banner bad"><span>💳 Hay ${nProb} pago(s) aprobado(s) sin registrar como venta.</span><span class="sp"></span><button class="btn btn-danger sm" data-act="nav" data-v="cobros">Revisar</button></div>`);
    else if (nRef) out.push(`<div class="banner warn"><span>↩ ${nRef} venta(s) con pago reembolsado siguen activas.</span><span class="sp"></span><button class="btn btn-yellow sm" data-act="nav" data-v="cobros">Revisar</button></div>`);
    else if (nPend) out.push(`<div class="banner info"><span>⏳ ${nPend} cobro(s) en línea pendiente(s) de pago.</span><span class="sp"></span><button class="btn btn-ghost sm" data-act="nav" data-v="cobros">Ver</button></div>`); }
  if (Store.persistent() && state.sales.length >= 5 && (!state.meta.lastBackupAt || Date.now() - new Date(state.meta.lastBackupAt) > 7 * 864e5)) out.push(`<div class="banner warn"><span>💾 Hace más de 7 días que no exportas un respaldo.</span><span class="sp"></span><button class="btn btn-yellow sm" data-act="exportBackup">Exportar respaldo</button></div>`);
  if (UI.view === 'caja' || UI.view === 'inventario') { const al = stockAlerts(); if (state.config.alerts.showBanner && (al.out.length || al.low.length) && UI.view === 'caja') out.push(`<div class="banner warn"><span>⚠ ${al.out.length ? `<b>${al.out.length}</b> agotado(s)` : ''}${al.out.length && al.low.length ? ' y ' : ''}${al.low.length ? `<b>${al.low.length}</b> con stock bajo` : ''}.</span><span class="sp"></span><button class="btn btn-yellow sm" data-act="nav" data-v="inventario">Ver inventario</button></div>`); }
  $('#banners').innerHTML = out.join('');
}
function tick() { const c = $('#clock'); if (c) c.innerHTML = `${esc(fDT.format(new Date()))}<br><span class="small">Hora de México</span>`; }
ACT.nav = t => go(t.dataset.v);
ACT.openMenu = () => { $('#nav').classList.add('open'); $('#scrim').classList.add('on'); };

/* ---------- eventos globales ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return; const f = ACT[t.dataset.act];
  if (f) { e.preventDefault(); try { const r = f(t, e); if (r && r.catch) r.catch(err => { console.error(err); toast('Error: ' + err.message, 'bad'); }); } catch (err) { console.error(err); toast('Error: ' + err.message, 'bad'); } }
});
document.addEventListener('input', e => { const t = e.target.closest('[data-input]'); if (t && INP[t.dataset.input]) INP[t.dataset.input](t, e); });
document.addEventListener('change', e => { const t = e.target.closest('[data-change]'); if (t && CHG[t.dataset.change]) CHG[t.dataset.change](t, e); });
window.addEventListener('hashchange', () => { const v = location.hash.replace('#/', ''); if (v && v !== UI.view && views[v]) go(v); });
window.addEventListener('error', e => { console.error(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { console.error(e.reason); });

function welcome() {
  openModal({
    title: '¡Bienvenida a tu caja registradora! 🍭', size: 'sm',
    body: `<p>¿Cómo quieres comenzar?</p><p class="muted small">Tus datos se guardan automáticamente en este navegador. Haz respaldos periódicos desde Configuración.</p>
    <div style="display:grid;gap:10px"><button class="btn btn-primary lg" data-w="new">🚀 Empezar mi negocio desde cero</button><label class="btn btn-ghost lg" style="cursor:pointer">📂 Restaurar un respaldo<input type="file" accept=".json,application/json" hidden data-w="file"></label></div>`,
    onOpen: api => {
      api.el.addEventListener('click', async e => { const b = e.target.closest('[data-w]'); if (!b || b.tagName === 'INPUT') return; if (b.dataset.w === 'new') { state.meta.welcomed = true; commit(); api.close(); go('config'); UI.cfgTab = 'negocio'; refresh(); toast('Empieza personalizando el nombre de tu negocio'); } });
      api.el.addEventListener('change', async e => { if (e.target.dataset.w === 'file') { state.meta.welcomed = true; commit(); api.close(); await CHG.importFile(e.target); } });
    }
  });
}

async function boot() {
  await Store.init(); let loaded = null;
  if (Store.persistent()) { try { loaded = await Store.get('state'); } catch (e) { console.error(e); } }
  if (loaded && loaded.app === APP_ID) state = migrate(loaded); else state = emptyState();
  let demoWiped = false;
  if (state.meta.demo) {   // se eliminan por completo los datos de demostración de versiones anteriores
    const keep = { cloud: state.config.cloud, rev: state.meta.cloudRev, at: state.meta.cloudAt };
    state = emptyState(); state.meta.welcomed = true; state.config.cloud = keep.cloud || state.config.cloud; state.meta.cloudRev = keep.rev; state.meta.cloudAt = keep.at; demoWiped = true; dirty = true;
  }
  UI.cart = newCart(); applyTheme();
  const menu = $('#menuBtn'); menu.addEventListener('click', () => { $('#nav').classList.add('open'); $('#scrim').classList.add('on'); }); $('#scrim').addEventListener('click', () => { $('#nav').classList.remove('open'); $('#scrim').classList.remove('on'); });
  const v = location.hash.replace('#/', ''); UI.view = views[v] ? v : 'caja'; render(); setInterval(tick, 20000);
  if (navigator.storage && navigator.storage.persist && Store.persistent()) navigator.storage.persist().catch(() => { });
  if (!loaded && !state.meta.welcomed) welcome();
  if (demoWiped) { commit(); setTimeout(() => toast('Se eliminaron los datos de demostración. Ya puedes capturar los tuyos.'), 600); }
  Cloud.check(); Pay.start();
  window.__ready = true;
}
boot();


</script></body></html>
